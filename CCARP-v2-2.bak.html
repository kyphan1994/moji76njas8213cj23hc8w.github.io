"t": "Move credentials out of the prompt context and resolve them from a server-side secret store."}, {"k": "D", "t": "Add actor attribution to tool-call logs so each call records the initiating user identity."}, {"k": "E", "t": "Replace the shared API key with per-user OAuth tokens carrying scope-restricted permissions."}], "ans": ["D", "E"]}, {"n": 56, "q": "An architect is reviewing a Claude-based candidate-screening tool prior to deployment. A stakeholder asserts that because the model was not trained on company data, no bias evaluation is necessary. Which two responses most accurately challenge this assertion? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Transparency obligations are satisfied by disclosing that an AI system is in use, without further evaluation."}, {"k": "B", "t": "Fairness testing is required only when the training dataset is known to contain protected-class labels."}, {"k": "C", "t": "The model may carry demographic biases from pretraining that manifest in screening outcomes regardless of fine-tuning."}, {"k": "D", "t": "The system should be evaluated on outcome-disparity metrics across protected groups before deployment."}, {"k": "E", "t": "Bias evaluation is unnecessary when the model provider has published a responsible-use policy."}], "ans": ["C", "D"]}, {"n": 57, "q": "A pilot AI assistant for procurement specialists shows 89 percent first-response acceptance, but follow-up surveys reveal that specialists frequently override the assistant’s vendor recommendations after considering criteria the assistant did not evaluate. The pilot owner wants to ship the assistant unchanged because of the strong acceptance rate.\nWhich two Discernment-competency observations should you raise BEFORE approving the launch? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "The acceptance rate alone proves readiness for general production use."}, {"k": "B", "t": "The survey response rate may not be statistically representative of all specialists."}, {"k": "C", "t": "The unconsidered criteria represent a scope gap in the assistant's input space."}, {"k": "D", "t": "Acceptance does not establish whether recommendations remain correct after specialist review."}, {"k": "E", "t": "The pilot duration was probably too short to demonstrate reliability across the full year."}], "ans": ["C", "D"]}, {"n": 58, "q": "The engineering lead at Trenova Systems, Inc. is evaluating two proposals for improving developer workflows using Claude-assisted tooling. \nProposal A adds Claude Code to the IDE for inline code generation and review. \nProposal B routes all code-generation requests through a shared Slack bot without IDE integration. \nWhich two observations most accurately evaluate these proposals against workflow-improvement objectives? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Proposal B is superior because centralizing requests in Slack creates an auditable log of all code-generation activity"}, {"k": "B", "t": "Proposal B introduces workflow friction by requiring developers to leave the IDE, undermining the productivity objective."}, {"k": "C", "t": "Proposal A reduces context switching by providing AI assistance at the point of development without requiring a separate tool."}, {"k": "D", "t": "Proposal B improves workflow velocity because Slack notifications create an asynchronous review queue."}, {"k": "E", "t": "Both proposals are equivalent because the model capabilities are identical regardless of the integration point"}], "ans": ["B", "C"]}, {"n": 59, "q": "You are evaluating a Claude-based deployment for adherence to a specific regulation. Which two steps must be completed BEFORE mapping deployment data flows to specific regulatory clauses? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Compare the in-place controls against the regulatory requirements to identify any compliance gaps."}, {"k": "B", "t": "Identify the applicability of the regulation based on data types, jurisdiction, and audience."}, {"k": "C", "t": "Schedule the remediation work with the engineering team based on the prioritized gap findings."}, {"k": "D", "t": "Document the identified gaps along with recommended remediations and residual risk for signoff."}, {"k": "E", "t": "Inventory the vendor-provided compliance tooling and confirm which compliance affordances are in place."}], "ans": ["B", "E"]}, {"n": 60, "q": "You are designing a feedback session for a deployment in flight. Which structure best supports productive stakeholder feedback?", "kind": "single", "opts": [{"k": "A", "t": "Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward."}, {"k": "B", "t": "Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates."}, {"k": "C", "t": "Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real time without preparation before the discussion begins."}, {"k": "D", "t": "End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward."}], "ans": ["B"]}, {"n": 61, "q": "You are reviewing a peer's end-to-end design for a Claude-based platform expected to scale to thousands of concurrent users. For each statement, indicate Yes if it reflects sound architectural practice. Otherwise, select No.", "kind": "match", "opts": [{"k": "A", "t": "Authentication and authorization run before retrieval so retrieval can filter by identity."}, {"k": "B", "t": "An asynchronous queue absorbs bursty traffic between intake and the model invocation layer."}, {"k": "C", "t": "Tax computation is encoded directly in the system prompt rather than in code."}, {"k": "D", "t": "Conversation logs include unredacted government identifiers to maximize signal for tuning."}], "choices": ["Yes", "No"], "ans": ["Yes", "Yes", "No", "No"]}, {"n": 62, "q": "You are assessing data-exfiltration risk in a Claude-based assistant that has tools for both internal-document retrieval and outbound HTTP calls. Which scenario most directly indicates a data-exfiltration risk?", "kind": "single", "opts": [{"k": "A", "t": "The outbound HTTP tool returns a 200 response when the assistant calls an allow-listed domain to fulfil a user-initiated data-lookup request."}, {"k": "B", "t": "The user submits a routine question and receives a routine answer."}, {"k": "C", "t": "Adversarial content in a retrieved document instructs the model to call the outbound HTTP tool and send sensitive content to an attacker-controlled URL."}, {"k": "D", "t": "The internal-document retrieval tool returns a document that the user is authorized to view."}], "ans": ["C"]}, {"n": 63, "q": "A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter decision. The fairness team has reviewed approval rate parity across protected groups and reported no significant difference. A board member has asked whether this evidence is sufficient to declare the assistant fair. Which two Discernment-competency findings should you report? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Approval rate parity does not by itself assess error rate parity across protected groups."}, {"k": "B", "t": "Match with human underwriters does not establish freedom from underwriter-introduced bias."}, {"k": "C", "t": "The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions."}, {"k": "D", "t": "The fairness team's review process likely missed at least some of the protected groups studied."}, {"k": "E", "t": "A larger sample is needed before any meaningful fairness claim can be made about the model."}], "ans": ["A", "B"]}, {"n": 64, "q": "An architect is reviewing a set of architecture documentation packages before handing off a Claude-based pipeline to an implementation team. Which two characteristics indicate that a documentation package is sufficient to support implementation without ongoing architect involvement? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "The document specifies integration contracts, configuration schemas, and expected input/output shapes for each component."}, {"k": "B", "t": "The document includes a decision log that records the rationale for key architectural choices and the alternatives rejected."}, {"k": "C", "t": "The document provides a high-level narrative description of the system without component-level detail."}, {"k": "D", "t": "The document includes the architect's contact information for questions during implementation."}], "ans": ["A", "B"]}, {"n": 65, "q": "You are reviewing a peer's draft system prompt that contains contradictory instructions: one section says never to speculate beyond the supplied source, while another says to confidently fill in any gaps. Which response is most appropriate?", "kind": "single", "opts": [{"k": "A", "t": "Add a priority instruction directing the model to evaluate all instructions and apply whichever appears most contextually appropriate on each request."}, {"k": "B", "t": "Remove or rewrite the gap-filling instruction so the prompt consistently constrains the model to source-supported content."}, {"k": "C", "t": "Increase temperature so output randomness masks the contradiction."}, {"k": "D", "t": "Keep both instructions and rely on the model to decide which one to follow on each request."}], "ans": ["B"]}, {"n": 66, "q": "You are comparing patterns for a batch document-classification job that follows fixed steps: extract metadata, classify, summarize, and persist. Which pattern is the best fit and why?", "kind": "single", "opts": [{"k": "A", "t": "A workflow pattern, because agentic patterns do not support tool invocations and therefore cannot execute the persist step that writes results to the downstream store."}, {"k": "B", "t": "An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks."}, {"k": "C", "t": "An agentic pattern, because agents are categorically more accurate than workflows and therefore always preferable regardless of step predictability."}, {"k": "D", "t": "A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility."}], "ans": ["D"]}, {"n": 67, "q": "A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product teams added capabilities. Triage accuracy has declined from 91 percent to 78 percent, and average tool-selection latency has increased by 2.3 seconds. A junior engineer has proposed adding a tool-router agent in front of the current agent to filter the tool list per request. \nWhich two findings should you present to justify capability decomposition before adding the router? \n(Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Tool descriptions overlap across multiple claim categories within the agent's tool set."}, {"k": "B", "t": "Several tools have not been invoked across the most recent 90 days of traffic."}, {"k": "C", "t": "The 34 tools serve four distinct claim-workflow domains within the triage scope."}, {"k": "D", "t": "The router pattern is well documented in the team's internal architecture guide."}, {"k": "E", "t": "The proposed router introduces an additional model call on every incoming request."}], "ans": ["A", "C"]}, {"n": 68, "q": "A Claude architect needs to ensure that a security-hardening flag cannot be disabled by any individual engineer after it is set. Which configuration scope correctly enforces this requirement?", "kind": "single", "opts": [{"k": "A", "t": "User scope (~/.claude/settings.json) on each engineer's machine."}, {"k": "B", "t": "Environment variable defined in the CI/CD pipeline only."}, {"k": "C", "t": "Managed configuration applied centrally and marked as non-overridable."}, {"k": "D", "t": "Project scope (.claude/settings.json) committed to the repository."}], "ans": ["C"]}, {"n": 69, "q": "A Claude architect is auditing configuration scope assignments. Which two statements correctly identify an appropriate use of user-scope configuration versus other scopes? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Persisting personal editor theme preferences that follow an engineer across projects."}, {"k": "B", "t": "Saving a preferred Claude response language that applies to all repositories the engineer uses."}, {"k": "C", "t": "Enforcing a company-wide policy that must not be overridden by individual engineers."}, {"k": "D", "t": "Defining MCP server endpoints shared by all contributors to a specific repository."}, {"k": "E", "t": "Storing API authentication keys so they are not committed to version control."}], "ans": ["A", "B"]}, {"n": 70, "q": "You are compiling factors that should drive the choice between Model Context Protocol (MCP), direct API integration, and agent-to-agent handoff. Which two factors belong on the list? (Select two.) Each correct answer presents a complete solution", "kind": "multi", "opts": [{"k": "A", "t": "Whether the vendor publishes detailed reference documentation for each candidate protocol"}, {"k": "B", "t": "Whether the team has prior implementation experience with any of the candidate protocols."}, {"k": "C", "t": "Whether the underlying transport supports encryption in transit between the integrated services."}, {"k": "D", "t": "Whether the integration must be portable across multiple AI clients in the ecosystem."}, {"k": "E", "t": "Whether the interaction is stateless and latency-sensitive or stateful and longer-running."}], "ans": ["D", "E"]}, {"n": 71, "q": "You are selecting a protocol for a single low-latency stateless tool call from a Claude-based assistant to an internal pricing service that already exposes a stable HTTP API. Which integration mechanism is the most appropriate?", "kind": "single", "opts": [{"k": "A", "t": "A direct API call to the existing endpoint with the appropriate scoped credentials."}, {"k": "B", "t": "A long-lived stateful session protocol for a stateless single-call interaction."}, {"k": "C", "t": "A bespoke streaming protocol layered over an unrelated asynchronous message bus."}, {"k": "D", "t": "An agent-to-agent handoff that introduces another Claude-based agent in front of the pricing service."}], "ans": ["A"]}, {"n": 72, "q": "A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents. Which mitigation is most directly targeted at this failure mode?", "kind": "single", "opts": [{"k": "A", "t": "Constrain responses to source-supported content, require citations, and add a verification step."}, {"k": "B", "t": "Score each new model version against a stable adversarial evaluation set."}, {"k": "C", "t": "Replace the shared API key with per-user OAuth tokens to improve access control."}, {"k": "D", "t": "Treat retrieved data as untrusted and apply input classifiers at ingestion time."}], "ans": ["A"]}, {"n": 73, "q": "You are defining escalation criteria for ambiguous cases in an automated workflow. Which set of criteria best supports consistent escalation?", "kind": "single", "opts": [{"k": "A", "t": "No escalation criteria; the model decides independently on every turn whether to escalate, without explicit confidence thresholds, impact categories, or classifier-based ambiguity flags."}, {"k": "B", "t": "Escalation only after an affected customer has contacted support to complain, after the automated workflow has already completed without human review."}, {"k": "C", "t": "Escalation at the discretion of whoever is available when the team's on-call engineer has spare capacity, without a defined threshold, category, or ambiguity criterion."}, {"k": "D", "t": "A confidence score below a defined threshold, presence of high-impact decision categories, ambiguity flags raised by content classifiers, and the user's explicit request for review."}], "ans": ["D"]}, {"n": 74, "q": "After a prompt-template update, several previously passing test cases now produce unexpected outputs. Which test type is specifically designed to detect this category of failure?", "kind": "single", "opts": [{"k": "A", "t": "Integration tests that verify end-to-end behavior across pipeline components."}, {"k": "B", "t": "Adversarial tests designed to probe for safety and injection vulnerabilities."}, {"k": "C", "t": "Regression tests scored against a stable reference set of known-good behavior."}, {"k": "D", "t": "Smoke tests that verify core paths are reachable after each deployment."}], "ans": ["C"]}, {"n": 75, "q": "A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline. The pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized roles. Which two metrics directly address these requirements? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "BLEU score computed against a human-annotated reference summary set."}, {"k": "B", "t": "Role-based access-control enforcement rate measured on a red-team dataset."}, {"k": "C", "t": "Throughput measured as successful requests processed per minute."}, {"k": "D", "t": "Per-query token cost measured against the defined cost ceiling."}, {"k": "E", "t": "Response latency at the 95th percentile across a one-week sample window."}], "ans": ["B", "D"]}, {"n": 76, "q": "You are choosing the level of detail for an implementation guide. The audience is a delivery team that will build the deployment. Which guidance composition best serves them?", "kind": "single", "opts": [{"k": "A", "t": "Component responsibilities, contracts between components, sequence diagrams of the dominant flows, configuration parameters with defaults, and operational runbooks."}, {"k": "B", "t": "Component responsibilities and interface contracts only, without sequence diagrams of the dominant flows, configuration parameters with defaults, or runbooks to guide operational tasks."}, {"k": "C", "t": "An architecture overview and sequence diagrams for the dominant flows, without interface contracts, configuration-parameter tables, or operational runbooks for the delivery team to follow."}, {"k": "D", "t": "An architecture overview and a list of known limitations, without component-level diagrams, interface contracts, configuration parameters, or operational runbooks to support implementation."}], "ans": ["A"]}, {"n": 77, "q": "You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request. Which optimization most directly targets the dominant cost driver?", "kind": "single", "opts": [{"k": "A", "t": "Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them."}, {"k": "B", "t": "Add additional repeated content to the system prompt to give the model more guidance."}, {"k": "C", "t": "Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query."}, {"k": "D", "t": "Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver."}], "ans": ["C"]}, {"n": 78, "q": "You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by AI. Which transparency practice most directly supports responsible deployment?", "kind": "single", "opts": [{"k": "A", "t": "Misrepresent the AI's role in producing responses in order to make the assistant feel more trustworthy or more human, undermining informed user consent and organizational transparency."}, {"k": "B", "t": "Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI's role as confidential operational information."}, {"k": "C", "t": "Disclose AI involvement to end users in line with the organization's transparency policy and provide a documented path to reach a human when needed."}, {"k": "D", "t": "Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system."}], "ans": ["C"]}, {"n": 79, "q": "An engineering organization is adopting Claude Code across 200 developers. A team lead proposes that AI-generated pull requests bypass standard code review for changes under 50 lines. Which two Diligence-competency objections should you raise? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Removing review eliminates the verification mechanism required for AI-generated output across the workflow."}, {"k": "B", "t": "Code-review capacity should be expanded to handle every code change submitted across the team."}, {"k": "C", "t": "The threshold should be increased to 200 lines to capture more changes."}, {"k": "D", "t": "AI-generated pull requests should be rejected by default across the organization."}, {"k": "E", "t": "Line count is a poor proxy for the actual risk introduced by a code change."}], "ans": ["A", "E"]}, {"n": 80, "q": "You are defining an SLA for a Claude-based assistant. Which SLA definition is most operationally meaningful?", "kind": "single", "opts": [{"k": "A", "t": "A target tied to a stakeholder sentiment measure such as “the team feels satisfied,” which cannot be measured objectively or used to trigger a documented breach response."}, {"k": "B", "t": "A measurable target with a defined metric, threshold, evaluation window, and consequence for breach—for example, 'p95 per-request latency under 800 ms over a 28-day window.'"}, {"k": "C", "t": "A qualitative commitment such as “the system will be fast and reliable,” which names no metric, threshold, or evaluation window."}, {"k": "D", "t": "A target that names the metric and threshold but omits the evaluation window and breach consequence, leaving compliance periods and remediation triggers undefined."}], "ans": ["B"]}, {"n": 81, "q": "A Claude architect is designing a HIPAA-compliant pipeline that processes patient records. Which two design decisions directly support HIPAA compliance requirements? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Setting max_tokens to a low value to minimize the volume of text generated per request."}, {"k": "B", "t": "Selecting the highest-capability Claude model to maximize diagnostic accuracy."}, {"k": "C", "t": "Enforcing role-based access controls so that PHI is retrievable only by authorized personnel."}, {"k": "D", "t": "Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place."}, {"k": "E", "t": "Using streaming responses to reduce perceived latency for clinical users."}], "ans": ["C", "D"]}, {"n": 82, "q": "You are designing a human-in-the-loop validation workflow for a new Claude-based deployment and must complete the design steps before piloting the workflow with a representative subset of traffic. Which two steps must be completed BEFORE piloting the workflow with a representative subset of traffic? \n(Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Define the sampling strategy and the escalation criteria at each oversight point in the pipeline."}, {"k": "B", "t": "Iterate the workflow design based on observed pilot findings before broader rollout to production."}, {"k": "C", "t": "Onboard the reviewer pool with role-specific training on the check criteria and escalation procedures."}, {"k": "D", "t": "Document the workflow with check criteria, escalation paths, and service-level agreements (SLAs) for each step."}, {"k": "E", "t": "Identify the decision points in the pipeline that require human oversight by impact and reversibility."}], "ans": ["A", "E"]}, {"n": 83, "q": "You are compiling team-setup practices for a Claude Code rollout across an engineering organization. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control."}, {"k": "B", "t": "Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers."}, {"k": "C", "t": "Use local scope for security-critical permission rules so each engineer can adapt them to ongoing work."}, {"k": "D", "t": "Use user scope for team-shared MCP servers so every engineer on the team has consistent access."}, {"k": "E", "t": "Use project scope for personal editor preferences so the preferences apply consistently within the project."}], "ans": ["A", "B"]}, {"n": 84, "q": "You are reviewing a customer-support agent's configuration. Each candidate tool falls into one of four categories: \n(1) required to complete defined tasks, \n(2) frequently used and reduces handoffs, \n(3) occasionally useful for unrelated work, \n(4) speculative future utility. \nWhich categories should typically remain in the agent configuration?", "kind": "single", "opts": [{"k": "A", "t": "Only category 3, because occasionally useful tools for unrelated work provide broader coverage and should take priority over tools required for the agent's defined tasks."}, {"k": "B", "t": "Only category 4, because speculative future-utility tools provide the most flexibility and should be configured even when no defined task currently requires them."}, {"k": "C", "t": "Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs."}, {"k": "D", "t": "All four categories, because broader tool access is categorically better for agent performance regardless of whether the tools map to defined tasks or regular hand-offs."}], "ans": ["C"]}, {"n": 85, "q": "You are documenting an architectural decision to support future audit and onboarding. Which artifact is the strongest fit?", "kind": "single", "opts": [{"k": "A", "t": "A slide deck in a presentation folder with no accompanying written rationale."}, {"k": "B", "t": "A code comment in a single file that contains an opinion of one engineer."}, {"k": "C", "t": "An Architecture Decision Record that states the context, the decision, the alternatives considered, the consequences, and the date and authors."}, {"k": "D", "t": "A short verbal note shared during a hallway conversation with no written record."}], "ans": ["C"]}, {"n": 86, "q": "During an architectural review, the security team identifies a risk that adversarial content injected into retrieved documents could manipulate the model's behavior. Which mitigation most directly addresses this threat?", "kind": "single", "opts": [{"k": "A", "t": "Treat all retrieved content as untrusted input and apply input classifiers with output validation."}, {"k": "B", "t": "Require citations for each claim and constrain responses to source-supported content."}, {"k": "C", "t": "Restrict outbound tool calls to an approved destination allow-list."}, {"k": "D", "t": "Score outputs against a stable adversarial evaluation set on each model-version change."}], "ans": ["A"]}, {"n": 87, "q": "You are evaluating an evaluation set used to score a Claude-based hiring-support tool. The set is drawn from one geographic region and one tenure band. Which response is most appropriate?", "kind": "single", "opts": [{"k": "A", "t": "Discard all quantitative evaluation and replace it with qualitative impressions collected from a small, convenience-selected group that may not represent the tool's full user population."}, {"k": "B", "t": "Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release."}, {"k": "C", "t": "Reduce the evaluation set further to a single demographic subgroup to simplify score interpretation, narrowing coverage rather than expanding it to match the intended user population."}, {"k": "D", "t": "Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset."}], "ans": ["B"]}, {"n": 88, "q": "You must present an architectural recommendation to deploy a Claude-based contract review assistant to a steering committee that includes the CFO, the general counsel, and the CIO. Each stakeholder cares about different aspects of the decision. How should you structure the recommendation document?", "kind": "single", "opts": [{"k": "A", "t": "Lead with the technical architecture diagram and the full component list before any other section."}, {"k": "B", "t": "Lead with detailed cost projections across the full multi-year horizon before the rationale section."}, {"k": "C", "t": "Present the same dense narrative throughout with no stakeholder differentiation in any section."}, {"k": "D", "t": "Lead with the architectural decision, then address each stakeholder's primary concerns directly."}], "ans": ["D"]}, {"n": 89, "q": "You are compiling a diagnostic toolkit for Claude Code operational issues. Which two diagnostic actions belong in the toolkit? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Increase the model sampling temperature so that intermittent issues surface more frequently for analysis."}, {"k": "B", "t": "File a support ticket with vendor support before any local reproduction or evidence collection."}, {"k": "C", "t": "Reproduce the issue with a minimal reproduction case that isolates one variable at a time."}, {"k": "D", "t": "Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific."}, {"k": "E", "t": "List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures."}], "ans": ["C", "E"]}, {"n": 90, "q": "A Claude Architect is reviewing a post-deployment performance report for an AI-assisted legal-document summarization system. The report includes these observations:\nAverage summarization time decreased from 47 minutes to 6 minutes per document.\nAssociates spend less time on summaries, but overall billable output has not measurably changed.\nInfrastructure costs increased by 22% because redundant retry logic generated additional API calls.\nSome summaries require attorney correction, adding an average of 8 minutes of review per document.\nWhich analysis correctly attributes each observation to the appropriate business-value pillar?", "kind": "single", "opts": [{"k": "A", "t": "Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue."}, {"k": "B", "t": "Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue."}, {"k": "C", "t": "Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering."}, {"k": "D", "t": "Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized; Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1."}], "ans": ["D"]}, {"n": 91, "q": "You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session. Which diagnostic step should be tried first?", "kind": "single", "opts": [{"k": "A", "t": "Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered."}, {"k": "B", "t": "Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue."}, {"k": "C", "t": "Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect."}, {"k": "D", "t": "Reinstall the developer's operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps."}], "ans": ["C"]}, {"n": 92, "q": "You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?", "kind": "single", "opts": [{"k": "A", "t": "Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task."}, {"k": "B", "t": "Use a separate model call to summarize all 60 tool definitions before each user turn."}, {"k": "C", "t": "Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability."}, {"k": "D", "t": "Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task."}], "ans": ["A"]}, {"n": 93, "q": "The compliance team at a firm has approved a Claude Skill that generates client-facing investment summaries. The Skill includes the firm’s required disclaimers and prohibited-language list. A product manager has asked whether additional guardrails are needed at the application layer or whether the Skill alone is sufficient.\nWhich two guardrail responsibilities should remain at the application layer rather than the Skill? (Select two.) \nEach correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Log every generated summary to the firm's compliance audit trail for retention."}, {"k": "B", "t": "Verify the requesting user is authorized to generate investment summaries at all."}, {"k": "C", "t": "Format output sections according to the firm's standardized house style guidelines."}, {"k": "D", "t": "Apply the disclaimer template that the compliance team has standardized firm-wide."}, {"k": "E", "t": "Apply the prohibited-language list that the compliance team maintains and updates."}], "ans": ["A", "B"]}, {"n": 94, "q": "You are supporting an EU-based deployment with GDPR obligations. Which combination of measures best supports the deployment's GDPR posture?", "kind": "single", "opts": [{"k": "A", "t": "Enterprise-tier deployment with a signed Data Processing Addendum, defined data-retention configuration, redaction of personal data not needed for the task, and documented data-subject rights handling."}, {"k": "B", "t": "Disabling all data-retention configuration, redaction controls, and data-subject-rights handling to simplify the deployment."}, {"k": "C", "t": "Using a personal Claude account tier for processing EU personal data at scale, with no signed Data Processing Addendum and no documented data-subject-rights handling procedure."}, {"k": "D", "t": "Pasting full EU personal data into every prompt to “give Claude complete context” without considering purpose limitation, data minimization, or the organization's Data Processing Addendum obligations."}], "ans": ["A"]}, {"n": 95, "q": "You are reviewing instrumentation in a multi-agent system. Which two findings constitute valid observability gaps in the instrumentation? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Trace spans for each agent step are exported to the shared distributed-tracing backend."}, {"k": "B", "t": "Latency and token usage on every span are emitted to the central metrics pipeline."}, {"k": "C", "t": "Tool-call payloads and outcomes are recorded with redaction applied to known sensitive fields."}, {"k": "D", "t": "Model identity and version on each turn are not recorded with the turn artifacts."}, {"k": "E", "t": "Request-scoped correlation identifiers do not propagate across agent and tool calls."}], "ans": ["D", "E"]}, {"n": 96, "q": "When communicating an architectural decision to a security and compliance reviewer, which content set is most aligned with that audience's primary concerns?", "kind": "single", "opts": [{"k": "A", "t": "Feature delivery schedule, roadmap dependencies, and scope boundaries for the product manager."}, {"k": "B", "t": "Implementation timeline, component interfaces, and deployment sequence for the engineering team."}, {"k": "C", "t": "Threat model, control mappings, residual-risk acceptance criteria, and audit traceability."}, {"k": "D", "t": "Decision rationale, business outcomes, and high-level risk summary for executive review."}], "ans": ["C"]}, {"n": 97, "q": "You are defining when to introduce a project subagent versus relying on Claude Code's general capabilities. Which scenario most directly justifies a dedicated subagent?", "kind": "single", "opts": [{"k": "A", "t": "The team has a recurring specialized task, such as database schema review, that requires a focused system prompt, narrow tool permissions, and a specific model selection across many sessions."}, {"k": "B", "t": "The team has a one-time ad hoc question that will not recur and does not require a focused system prompt, narrow tool permissions, or dedicated model selection."}, {"k": "C", "t": "The team has no recurring specialized tasks and uses Claude Code only for isolated general-purpose work that does not justify a dedicated system prompt or tool scope."}, {"k": "D", "t": "The team wants every Claude Code interaction to use the same generic system prompt with no task-specific specialization, narrow tool permissions, or dedicated model selection."}], "ans": ["A"]}, {"n": 98, "q": "You are identifying signals that a deployment should re-enter design rather than continue iterating in place. Which signal most directly indicates the need for a new design cycle?", "kind": "single", "opts": [{"k": "A", "t": "A minor copy edit is requested in a customer-facing string within the existing UI, which can be handled as a localized content change without altering component responsibilities or contracts."}, {"k": "B", "t": "A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle."}, {"k": "C", "t": "A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts."}, {"k": "D", "t": "The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts."}], "ans": ["D"]}, {"n": 99, "q": "You are rolling out monitoring for a Claude-based deployment and must complete the specification steps before instrumenting the deployment. Which two steps must be completed BEFORE instrumenting the deployment to emit metrics and traces? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Define the metrics and the slices the deployment will monitor across normal and adversarial traffic."}, {"k": "B", "t": "Tune the alert thresholds based on observed normal-state distributions to reduce false positives."}, {"k": "C", "t": "Define the service-level objectives (SLOs) and the error budgets the deployment will be held to."}, {"k": "D", "t": "Build the dashboards that surface metrics across slices at the cadence the team operates on."}, {"k": "E", "t": "Document the dashboards, alerts, and runbooks for the on-call rotation that will respond."}], "ans": ["A", "C"]}, {"n": 100, "q": "You are integrating Claude Code into a team workflow and must complete the design and configuration steps before piloting the integrated workflow with a small group. Which two steps must be completed BEFORE piloting the integrated workflow? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Document the integrated workflow with handoff criteria, permission boundaries, and on-call runbooks."}, {"k": "B", "t": "Identify the workflow steps where AI-assisted tooling adds value and where human authority must remain."}, {"k": "C", "t": "Negotiate the workflow change with affected teams and obtain formal sign-off from each manager."}, {"k": "D", "t": "Iterate the integrated workflow based on pilot findings before broader rollout to the team."}, {"k": "E", "t": "Configure the project-scope MCP servers, permissions, subagents, and persistent project context."}], "ans": ["B", "E"]}, {"n": 101, "q": "You are preparing a HIPAA-eligible deployment for a healthcare customer. Which configuration supports HIPAA compliance using Anthropic-offered tools?", "kind": "single", "opts": [{"k": "A", "t": "Claude Free with no contractual addendum, since consumer products meet HIPAA requirements out of the box."}, {"k": "B", "t": "Claude Enterprise with a signed Business Associate Agreement, Zero Data Retention enabled, and audit logging configured for compliance tracking."}, {"k": "C", "t": "Disabling all audit logging so that no PHI is recorded in any log store, on the assumption that the absence of logs satisfies HIPAA requirements without a signed BAA."}, {"k": "D", "t": "An ad-hoc personal Claude account used by individual clinicians for PHI-related tasks, with no Business Associate Agreement, no Zero Data Retention, and no audit logging configured."}], "ans": ["B"]}, {"n": 102, "q": "You are listing characteristics of strong architectural-decision communication. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Ownership and review cadence for revisiting the decision when conditions or assumptions change."}, {"k": "B", "t": "Distribution to a standing review forum with mandatory attendance from senior engineering leaders."}, {"k": "C", "t": "Omission of rejected alternatives to keep the decision document focused and concise for readers."}, {"k": "D", "t": "Alternatives considered along with the criteria that were used to evaluate each alternative."}, {"k": "E", "t": "Use of a consistent template across the team to standardize the visual presentation of decisions."}], "ans": ["A", "D"]}, {"n": 103, "q": "You are integrating Claude Code into a workflow that runs against a production database. Which guardrail design most directly preserves safety on data-modifying operations?", "kind": "single", "opts": [{"k": "A", "t": "Allow Claude Code to write directly to the production database without subagent scoping, read-only credential defaults, or human confirmation gates on data-modifying operations."}, {"k": "B", "t": "Configure the database MCP server with a fully privileged credential that can perform any read or write operation, and allow all operations to proceed without explicit human confirmation."}, {"k": "C", "t": "Disable all logging and auditing on database operations through the MCP server to reduce alert noise, removing the observability needed to detect unintended data modifications."}, {"k": "D", "t": "Configure the database MCP server with a read-only credential by default, restrict the subagent's tool list to read-only operations, and require explicit human confirmation on any operation that would modify data."}], "ans": ["D"]}, {"n": 104, "q": "You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps before running the deployment against the dataset. Which two steps must be completed BEFORE running the deployment against the evaluation dataset? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Publish the aggregated metrics to a dashboard and gate releases on threshold checks."}, {"k": "B", "t": "Curate and label the evaluation dataset to match the defined slices."}, {"k": "C", "t": "Review failure cases with subject matter experts to refine the scoring rubric."}, {"k": "D", "t": "Define the metrics and slices the framework will report across representative, edge, and adversarial cases."}, {"k": "E", "t": "Score the deployment outputs against the reference labels and compute aggregate metrics."}], "ans": ["B", "D"]}, {"n": 105, "q": "You are rolling out a standardized Claude Code configuration to an engineering team and must complete the planning steps before piloting the configuration. \nWhich two steps must be completed BEFORE piloting the configuration with a small group of engineers? \n(Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Define the project-scope baseline covering Model Context Protocol (MCP) servers, permission rules, and subagents."}, {"k": "B", "t": "Onboard every engineer in the organization to the new configuration through mandatory training sessions."}, {"k": "C", "t": "Roll out the stabilized configuration to additional teams with documentation and a defined support channel"}, {"k": "D", "t": "Identify the team workflows, security boundaries, and which decisions belong to managed configuration versus project scope."}, {"k": "E", "t": "Iterate the configuration based on the pilot findings and stabilize the baseline before broader rollout."}], "ans": ["A", "D"]}, {"n": 106, "q": "A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation assistant. Architecture X produces higher output quality scores but costs $0.18 per documentation session and averages 4.2 seconds per response. Architecture Y scores slightly lower on quality metrics but costs $0.09 per session and averages 2.1 seconds per response. The stated SLA requires responses under 3 seconds, and the annual volume is projected at 2 million documentation sessions.\n Which evaluation approach correctly applies business value pillar analysis to this decision?", "kind": "single", "opts": [{"k": "A", "t": "Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments."}, {"k": "B", "t": "Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment."}, {"k": "C", "t": "Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity."}, {"k": "D", "t": "Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most."}], "ans": ["C"]}, {"n": 107, "q": "You are explaining the precedence of Claude Code configuration scopes to the team. Which precedence ordering, from highest to lowest, is correct?", "kind": "single", "opts": [{"k": "A", "t": "Local > managed > user > command-line arguments > project"}, {"k": "B", "t": "Project > user > managed > local > command-line arguments"}, {"k": "C", "t": "Managed > command-line arguments > local > project > user"}, {"k": "D", "t": "User > project > local > command-line arguments > managed"}], "ans": ["C"]}, {"n": 108, "q": "A Claude architect is leading the discovery phase for a new AI-powered customer service solution. Which two activities are characteristic of structured discovery and requirement gathering for a Claude-based deployment? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins."}, {"k": "B", "t": "Selecting the Claude model tier based on the architect's prior project experience before stakeholder input is collected."}, {"k": "C", "t": "Generating an initial prototype and iterating based on user reaction rather than written requirements."}, {"k": "D", "t": "Documenting explicit success criteria and failure thresholds that will gate production deployment."}, {"k": "E", "t": "Deferring constraint documentation until the integration design phase to avoid scope creep."}], "ans": ["A", "D"]}, {"n": 109, "q": "You are classifying token-management tactics by where each tactic applies in the request lifecycle: 'Input Preparation,' 'Prompt Construction,' or 'Output Handling.'", "kind": "match", "opts": [{"k": "A", "t": "Persist the validated output for downstream consumption and audit"}, {"k": "B", "t": "Order the prompt sections so cacheable content sits before per-request content"}, {"k": "C", "t": "Summarize prior conversation history when full history is no longer needed"}, {"k": "D", "t": "Validate the model's structured output against the expected schema"}, {"k": "E", "t": "Move stable repeated content into a cacheable prefix at the head of the prompt"}, {"k": "F", "t": "Trim retrieved passages to spans relevant to the user's question"}], "choices": ["Input Preparation", "Output Handling", "Prompt Construction"], "ans": ["Output Handling", "Prompt Construction", "Input Preparation", "Output Handling", "Prompt Construction", "Input Preparation"]}, {"n": 110, "q": "A customer support team has proposed delegating customer refund decisions to a Claude-driven workflow with no human review for refunds under 50 USD. The team's reasoning is that small refunds are low-risk and human review would erase the efficiency gain. Which Delegation-competency principle should guide your response?", "kind": "single", "opts": [{"k": "A", "t": "Delegation should always include human review on every decision the workflow produces."}, {"k": "B", "t": "Delegation scope should reflect the type of risk involved, not the transaction size alone."}, {"k": "C", "t": "Delegation scope should be set primarily by maximizing efficiency gains across the workflow."}, {"k": "D", "t": "Delegation should be avoided entirely wherever financial transactions occur in the workflow."}], "ans": ["B"]}, {"n": 111, "q": "You are identifying inefficiency in a Claude Code workflow where each engineer manually re-explains the project's conventions and architecture in every session. Which adjustment most directly removes this inefficiency?", "kind": "single", "opts": [{"k": "A", "t": "Forbid the use of Claude Code on the project entirely to avoid the session-initialization overhead, accepting that the team loses all AI-assisted development productivity for this codebase."}, {"k": "B", "t": "Capture the project's conventions and architecture in a project-scoped CLAUDE.md (or equivalent persistent project-context file) committed to the repository, so each session loads it automatically."}, {"k": "C", "t": "Tell each engineer to retype the project conventions and architecture context more quickly at the start of each session, reducing time lost without eliminating the repeated manual effort."}, {"k": "D", "t": "Remove all documented project conventions and architectural standards so engineers have nothing to re-explain at session start, accepting the loss of consistency and shared coding standards."}], "ans": ["B"]}, {"n": 112, "q": "The compliance team has authored a regulatory disclosure procedure that must be applied identically across customer service, sales, and onboarding workflows. Which two design decisions should you include? (Select two.) Each correct answer presents part of the solution", "kind": "multi", "opts": [{"k": "A", "t": "Package the procedure as a Claude Skill owned directly by the compliance team."}, {"k": "B", "t": "Embed the procedure text into each workflow's system prompt at integration time."}, {"k": "C", "t": "Store the procedure in a shared retrieval corpus accessible to each workflow independently."}, {"k": "D", "t": "Have each workflow team rewrite the procedure for its own context."}, {"k": "E", "t": "Reference the same Claude Skill from all three workflow integrations."}], "ans": ["A", "E"]}, {"n": 113, "q": "You are compiling continuity practices that span the deployment lifecycle. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Maintain a stakeholder register and notify the listed parties at every phase transition event."}, {"k": "B", "t": "Carry the evaluation framework and reference set forward across iterations rather than rebuilding each time."}, {"k": "C", "t": "Archive every phase deliverable in long-term storage to preserve a record of what was produced."}, {"k": "D", "t": "Capture lessons learned at the end of each phase and surface them as inputs to the next phase."}, {"k": "E", "t": "Lock decisions made in early phases to prevent revisiting them as later phases begin."}], "ans": ["B", "D"]}];

<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCARP – Luyện thi Claude Certified Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try{var t=localStorage.getItem('ccarp-theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){}
</script>
<style>
:root{
  --bg:#0B1220;--bg2:#0F1B34;--surface:#111B2F;--surface2:#16223C;--ink:#E6EDF7;--muted:#98A8C2;
  --line:rgba(150,175,215,.15);--line2:rgba(150,175,215,.30);
  --accent:#4FB8FF;--accent2:#8B7CFF;--on-accent:#06101F;
  --ok:#34D399;--ok-soft:rgba(52,211,153,.13);--bad:#FB7185;--bad-soft:rgba(251,113,133,.13);--warn:#FBBF24;--warn-soft:rgba(251,191,36,.12);
  --shadow:0 1px 2px rgba(0,0,0,.28),0 10px 28px rgba(0,0,0,.16);
  --t1:#5BB4F5;--t2:#F3A64C;--t3:#40CDBA;--t4:#8EA0FF;--t5:#C08CFF;--t6:#F58CC0;--t7:#D9B98A;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F6FA;--bg2:#E8EEF8;--surface:#FFFFFF;--surface2:#F2F5FA;--ink:#18212F;--muted:#586980;
  --line:#DFE5EE;--line2:#C6D0DF;
  --accent:#1B6FD6;--accent2:#6A4FD8;--on-accent:#FFFFFF;
  --ok:#0B8F61;--ok-soft:#E1F4EB;--bad:#CF3450;--bad-soft:#FCE7EB;--warn:#A86400;--warn-soft:#FDF0D8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
  --t1:#0A6BB5;--t2:#A45A06;--t3:#0B7D6E;--t4:#3F4FC9;--t5:#7B3FCE;--t6:#B2367A;--t7:#85622F;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.6 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;
  background:radial-gradient(1000px 520px at 88% -12%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
code{font-family:"IBM Plex Mono",Consolas,monospace;font-size:.88em;padding:1px 5px;border-radius:5px;background:var(--surface2);border:1px solid var(--line)}
kbd{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);border-bottom-width:2px;background:var(--surface)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand small{font-family:"IBM Plex Sans",sans-serif;font-weight:500;font-size:12.5px;letter-spacing:0;margin-left:8px;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.tabs{display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:8px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tbadge{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:0 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.tab[aria-selected="true"] .tbadge{background:rgba(0,0,0,.18);color:inherit}
.spacer{flex:1}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--accent)}
:root[data-theme="dark"] .i-moon,:root[data-theme="light"] .i-sun{display:none}
.hprog{height:3px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.hprog i.time{background:linear-gradient(90deg,var(--warn),var(--accent))}
.runbar .in{padding-top:8px;padding-bottom:8px;gap:12px}
.timer{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line2)}
.timer.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.rinfo{font-size:14.5px;color:var(--muted)}
.rinfo b{color:var(--ink)}
.mbadge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);margin-left:6px}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s,filter .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:11px 28px;font-size:16px;border-radius:11px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line2)}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
#pWrong[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
#xFlag[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:14px;font-weight:500}
.linkbtn:hover{text-decoration:underline}
.sel{padding:6px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink);font-size:14px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{--tc:var(--accent);display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:99px;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--tc)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.chip .cnt{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 17%,var(--surface))}
.chip:disabled{opacity:.4;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- layout ---------- */
main{padding-bottom:80px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 0}
.wrap.wide{max-width:1120px}
.ptools{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent)}
.pin{max-width:860px;margin:0 auto;padding:12px 16px;display:grid;gap:10px}
.prow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.stats{font-size:14.5px;color:var(--muted);margin-right:auto}
.stats b{color:var(--ink);font-family:"Chakra Petch",sans-serif;font-size:16px}
.stats .sname{color:var(--ink);font-weight:600}
.stats .pend{color:var(--warn);font-weight:600;font-size:14.5px}
@media (max-width:599px){.ptools .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}}
@media (min-width:760px){.ptools{position:sticky;top:var(--hh,58px);z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line2);border-radius:14px}
.inotes{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:12px;padding:12px 18px;margin-bottom:16px}
.inotes summary{cursor:pointer;font-weight:600}
.inotes ul{margin:10px 0 4px;padding-left:20px}
.inotes li{margin:4px 0;font-size:15px}

/* ---------- question card ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 16px;box-shadow:var(--shadow);transition:border-color .2s}
.q.hide{display:none}
.q.right{border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.q.wrong{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.flash{animation:flash 1.3s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.qnum{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:18px;color:var(--accent);letter-spacing:.03em}
.qsub{font-size:13.5px;color:var(--muted);margin-right:4px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.topic{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 38%,transparent)}
.fbadge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;color:var(--warn);background:var(--warn-soft)}
.qtext{white-space:pre-line;margin:0 0 14px;font-size:16.5px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;margin:7px 0;border-radius:11px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;position:relative;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt .k{flex:none;display:grid;place-items:center;width:27px;height:27px;border-radius:50%;border:1.5px solid var(--line2);font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:13px;color:var(--muted);margin-top:-1px}
.opt input[type="checkbox"]+.k{border-radius:7px}
.opt .t{flex:1;min-width:0}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface2))}
.opt:has(input:checked) .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.locked .opt{cursor:default}
.opt.match{cursor:default;flex-wrap:wrap;align-items:center}
.opt.match .t{flex:1 1 280px}
.opt.match select{min-width:210px;padding:7px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--ink)}
.corr{display:none;width:100%;padding-left:39px;font-size:13.5px;font-weight:600;color:var(--ok)}
/* đáp án đúng */
.reveal .opt.is-ans{border-color:var(--ok);background:var(--ok-soft)}
.reveal .opt.is-ans .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.reveal .opt.is-ans .t::after{content:"  ✓";color:var(--ok);font-weight:700}
/* chọn sai */
.reveal .opt.picked-wrong{border-color:var(--bad);background:var(--bad-soft)}
.reveal .opt.picked-wrong .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.reveal .opt.picked-wrong .t{text-decoration:line-through;text-decoration-color:var(--bad)}
.graded .opt:not(.match):has(input:checked)::after{content:"Bạn chọn";align-self:center;margin-left:auto;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor;color:var(--muted);white-space:nowrap}
.reveal .opt.match .corr{display:block}
.reveal .opt.match.good{border-color:var(--ok);background:var(--ok-soft)}
.reveal .opt.match.good .corr::after{content:"  ✓"}
.reveal .opt.match.bad{border-color:var(--bad);background:var(--bad-soft)}
.why{display:none;margin-top:14px;padding:12px 16px;border-radius:11px;background:color-mix(in srgb,var(--accent) 8%,var(--surface2));border:1px solid color-mix(in srgb,var(--accent) 26%,transparent)}
.reveal .why{display:block}
.why-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.why p{margin:0;font-size:15px}
.why p.warn{margin-top:8px;color:var(--warn)}
.qfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.qfoot:empty{display:none}
.verdict{font-weight:700;font-size:14.5px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}.verdict.blank{color:var(--muted)}

/* ---------- panels (setup / result / notes) ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel.slim{padding:12px 20px}
.panel h2{margin:0 0 4px;font-size:22px;line-height:1.3}
.panel h3{margin:0;font-size:17px}
.lead{color:var(--muted);margin:0 0 14px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.field{padding:14px 0;border-top:1px solid var(--line)}
.flabel{font-weight:600;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.flabel .hint{font-weight:400;color:var(--muted);font-size:14px}
.flabel b{font-family:"Chakra Petch",sans-serif;font-size:18px;color:var(--accent)}
input[type="range"]{width:100%;accent-color:var(--accent);margin:0 0 10px}
input[type="checkbox"],input[type="radio"]{accent-color:var(--accent)}
.checkline{display:flex;gap:10px;align-items:center;padding:3px 0;cursor:pointer;width:fit-content}
.checkline input{width:17px;height:17px}
.customrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.num-in{width:96px;padding:6px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:block;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface2)}
.mode:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface2))}
.mode input{margin:0 6px 0 0;vertical-align:-2px}
.mode span{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.startrow{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
.summary{color:var(--muted)}
.summary b{color:var(--ink)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.score{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:17px;text-align:center;border-radius:9px;padding:5px 0}
.score.g{color:var(--ok);background:var(--ok-soft)}.score.m{color:var(--warn);background:var(--warn-soft)}.score.b{color:var(--bad);background:var(--bad-soft)}
.hmeta{font-size:14px;color:var(--muted);line-height:1.5}
.hmeta b{color:var(--ink)}
.hdate{font-size:13px;color:var(--muted);white-space:nowrap}
/* run */
.run{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.runnav{display:flex;gap:8px;flex-wrap:wrap}
.runnav .grow{flex:1}
.kbd{color:var(--muted);font-size:13px;margin:12px 0 0}
.gridnav{position:sticky;top:calc(var(--hh,110px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.gn-h{font-weight:600;font-size:14px;margin-bottom:10px}
.gn{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:52vh;overflow:auto;padding:3px}
.gn button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:14px;cursor:pointer;position:relative;padding:0}
.gn button:hover{border-color:var(--accent)}
.gn button.ans{background:color-mix(in srgb,var(--accent) 22%,var(--surface2));border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.gn button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.gn button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.gn button.cur{outline:2px solid var(--ink);outline-offset:1px}
.gn button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line2);background:var(--surface2)}
.legend i.a{background:color-mix(in srgb,var(--accent) 22%,var(--surface2));border-color:var(--accent)}
.legend i.f{background:var(--warn);border-color:var(--warn);border-radius:50%}
.legend i.o{background:var(--ok-soft);border-color:var(--ok)}
.legend i.x{background:var(--bad-soft);border-color:var(--bad)}
/* result */
.res-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bigpct{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:64px;line-height:1}
.bigpct.g{color:var(--ok)}.bigpct.m{color:var(--warn)}.bigpct.b{color:var(--bad)}
.res-title{font-size:20px;font-weight:600}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:8px 16px;min-width:100px}
.kpi .v{font-family:"Chakra Petch",sans-serif;font-size:21px;font-weight:700}
.kpi .v.ok{color:var(--ok)}.kpi .v.bad{color:var(--bad)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.tbars{display:grid;gap:10px;margin:10px 0 4px}
.tbrow{display:grid;grid-template-columns:minmax(130px,210px) 1fr 92px;gap:12px;align-items:center;font-size:14.5px}
.tbrow .nm{display:flex;align-items:center;gap:8px}
.tbrow .nm .dot{width:9px;height:9px;border-radius:50%;background:var(--tc);flex:none}
.track{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.track i.g{background:var(--ok)}.track i.m{background:var(--warn)}.track i.b{background:var(--bad)}
.tbrow .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.advice{margin-top:18px;padding:12px 16px;border-radius:11px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.advice .txt{flex:1 1 260px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
/* notes */
.tips ul,.ncard ul{padding-left:20px;margin:10px 0 0}
.tips li{margin:6px 0}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.ncard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;scroll-margin-top:calc(var(--hh,58px) + 12px)}
.ncard h3{margin:0;font-size:17px}
.ncard .c{color:var(--muted);font-size:13px}
.ncard ul{flex:1;margin-bottom:14px}
.ncard li{margin:6px 0;font-size:15px}
.ncard .acts{margin-top:auto}
/* toast & dialog */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--surface);color:var(--ink);padding:22px 24px;width:min(440px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,10,20,.55)}
dialog p{margin:0;font-size:16px}
dialog .acts{justify-content:flex-end}

@media (max-width:860px){
  .run{grid-template-columns:1fr}
  .gridnav{position:static}
  .gn{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));max-height:none}
}
@media (max-width:600px){
  .tabs{order:3;width:100%}
  .tab{flex:1;justify-content:center;padding:6px 8px}
  .q{padding:16px}
  .panel{padding:18px 16px}
  .modes{grid-template-columns:1fr}
  .opt.match select{width:100%;margin-left:39px;min-width:0;width:calc(100% - 39px)}
  .tbrow{grid-template-columns:1fr 80px}
  .tbrow .track{grid-column:1/-1;grid-row:2}
  .hist li{grid-template-columns:56px 1fr}
  .hdate{grid-column:2}
  .bigpct{font-size:52px}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header class="top" id="top">
  <div class="in">
    <h1 class="brand">CCARP<small>113 câu</small></h1>
    <nav class="tabs" role="tablist" aria-label="Chế độ">
      <button class="tab" role="tab" data-v="practice">Luyện tập</button>
      <button class="tab" role="tab" data-v="exam">Luyện đề <span class="tbadge" id="tabTimer" hidden></span></button>
      <button class="tab" role="tab" data-v="notes">Ghi nhớ</button>
    </nav>
    <span class="spacer"></span>
    <button class="iconbtn" id="themeBtn" aria-label="Đổi giao diện sáng / tối" title="Đổi giao diện sáng / tối">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="runbar" id="runbar" hidden>
    <div class="in">
      <span class="timer" id="xTimer">00:00</span>

      <button class="btn ghost" id="xQuit" style="margin-left:auto">Huỷ lượt</button>
      <button class="btn primary" id="xSubmit">Nộp bài</button>
    </div>
  </div>
  <div class="hprog"><i id="hbar"></i></div>
</header>

<main>
  <section class="view" id="vPractice">
    <div class="ptools"><div class="pin">
      <div class="prow">
        <span class="stats" id="pStats"></span>
        <select class="sel" id="pJump" aria-label="Nhảy tới câu"></select>
        <button class="btn" id="pWrong" aria-pressed="false">Chỉ câu sai</button>
        <button class="btn" id="pShow" aria-pressed="false">Hiện đáp án</button>
        <button class="btn primary" id="pGrade">Chấm các câu đã làm</button>
        <button class="btn ghost" id="pReset">Làm lại</button>
      </div>
      <div class="chips" id="pChips" role="group" aria-label="Lọc theo chủ đề"></div>
    </div></div>
    <div class="wrap">
      <details class="inotes" id="pNotes" hidden><summary></summary><ul></ul></details>
      <p class="empty" id="pEmpty" hidden>Không có câu nào khớp bộ lọc hiện tại.</p>
      <div id="pList"></div>
    </div>
  </section>

  <section class="view" id="vExam" hidden><div class="wrap" id="xWrap"></div></section>

  <section class="view" id="vNotes" hidden><div class="wrap wide" id="nWrap"></div></section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog"><p id="dlgMsg"></p><div class="acts"><button class="btn" value="cancel" id="dlgCancel">Huỷ</button><button class="btn primary" value="ok" id="dlgOk">Đồng ý</button></div></form></dialog>

<script>
const DATA = [{"n": 1, "q": "You are configuring tool permissions for a Claude-based assistant. The assistant's defined responsibilities require read access to a knowledge base and write access to a draft queue, and nothing else. Which scoping design best applies least privilege?", "kind": "single", "opts": [{"k": "A", "t": "Allow access to all tools with read permissions globally across the system."}, {"k": "B", "t": "Per-role allow-list of exactly the read-knowledge-base and write-draft-queue tools, enforced at the orchestration layer."}, {"k": "C", "t": "Allow access to every tool in the catalog and rely on the model to decline tools it should not use."}, {"k": "D", "t": "Disable all tools entirely to achieve a minimal permission surface."}], "ans": ["B"]}, {"n": 2, "q": "You are diagnosing a Claude Code session whose subagent uses 50,000 tokens of context before the engineer types a single message. Which root cause is most likely?", "kind": "single", "opts": [{"k": "A", "t": "The developer's keyboard layout or input-method configuration is the cause of the elevated context consumption, introducing extra tokens before the engineer types any message."}, {"k": "B", "t": "Many MCP servers are configured, each contributing tool definitions to the context budget; Tool Search is not enabled, so all definitions load upfront."}, {"k": "C", "t": "The model has internal personal preferences or default behaviors that silently consume large portions of context budget before any user message is processed, independent of tool configuration."}, {"k": "D", "t": "The font rendering or display-scaling settings of the IDE are converting visual output into additional context tokens, causing the high pre-session context consumption."}], "ans": ["B"]}, {"n": 3, "q": "You are integrating Claude Code into the team's pull-request workflow. The team wants AI-assisted review without removing human approval. Which integration design best fits this requirement?", "kind": "single", "opts": [{"k": "A", "t": "Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer retains the approval decision under the existing branch-protection rules."}, {"k": "B", "t": "Claude Code merges every pull request automatically after completing its analysis, bypassing human approval and the existing branch-protection rules."}, {"k": "C", "t": "Claude Code disables all existing branch-protection rules to streamline the merge process, removing human approval as a required gate."}, {"k": "D", "t": "Claude Code silently deletes pull requests it assesses as low quality without posting a comment or notifying the author."}], "ans": ["A"]}, {"n": 4, "q": "A technical team is debating whether to implement a new capability for generating regulatory filings from internal data as a Claude Skill or as an MCP server. The capability requires a fixed authoring procedure with embedded examples, does not need to call live external systems, and must be portable across three Claude deployments: claude.ai, an internal API integration, and Claude Code. Which factor most strongly favors implementing the capability as a Skill?", "kind": "single", "opts": [{"k": "A", "t": "The capability needs to query a live database for the most recent regulatory filings."}, {"k": "B", "t": "The capability must also be callable from a developer's command-line interface."}, {"k": "C", "t": "The capability requires direct authentication against the corporate identity provider."}, {"k": "D", "t": "The capability is procedural knowledge with no live external-system calls required."}], "ans": ["D"]}, {"n": 5, "q": "You are producing an architecture guide for a new deployment and must complete the planning steps before drafting each section. Which two steps must be completed BEFORE drafting each section of the guide? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Identify the audience and the questions the guide must answer for that audience."}, {"k": "B", "t": "Translate the guide into the supported regional languages before drafting."}, {"k": "C", "t": "Validate the guide with the implementation team and incorporate corrections."}, {"k": "D", "t": "Establish the document under version control and assign a review cadence."}, {"k": "E", "t": "Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations"}], "ans": ["A", "E"]}, {"n": 6, "q": "A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered procurement automation deployment. The feedback includes four statements: (1) \"Our procurement team is processing 3x more purchase orders per analyst per day.\" (2) \"We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship management.\" (3) \"The API integration costs are running 40% over the projected per-transaction budget.\" (4) \"Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second SLA.\" Which of the following correctly identifies the primary business value pillar each stakeholder statement represents?", "kind": "single", "opts": [{"k": "A", "t": "Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4: Performance SLA"}, {"k": "B", "t": "Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4: Performance SLA"}, {"k": "C", "t": "Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4: Efficiency"}, {"k": "D", "t": "Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4: Solution Cost"}], "ans": ["A"]}, {"n": 7, "q": "You are building a feedback-and-alignment routine for a multi-stakeholder deployment. Which two practices belong in the routine? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Record each session and distribute the recording to stakeholders who could not attend live."}, {"k": "B", "t": "Escalate any disagreement among stakeholders to the executive sponsor for binding resolution."}, {"k": "C", "t": "Rotate facilitation among the participating stakeholder groups to share ownership of the routine."}, {"k": "D", "t": "Set a regular cadence for revisiting expectations and assumptions as conditions evolve over time."}, {"k": "E", "t": "Reconcile divergent stakeholder positions explicitly rather than papering over them in the moment"}], "ans": ["D", "E"]}, {"n": 8, "q": "A business sponsor has requested an AI solution to 'improve customer experience.' The sponsor cannot articulate which customer journey is failing, which metric reflects the failure, or which decisions the AI should support. The sponsor is asking you to begin design work next week. Which delegation-competency action should you take first?", "kind": "single", "opts": [{"k": "A", "t": "Recommend that the sponsor revise the request and resubmit it later for evaluation."}, {"k": "B", "t": "Begin prototyping a generic assistant against the broad request before the next deadline."}, {"k": "C", "t": "Propose a fixed scope that you commit to by default based on your own assumptions."}, {"k": "D", "t": "Facilitate a structured discovery to define the failing decision and the target metric."}], "ans": ["D"]}, {"n": 9, "q": "You are responding to a stakeholder request that adds significant scope to a deployment already in flight. Which response best aligns expectations while respecting the stakeholder's underlying need?", "kind": "single", "opts": [{"k": "A", "t": "Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications."}, {"k": "B", "t": "Decline the request outright without acknowledging the stakeholder's underlying need or offering alternatives such as deferral, descoping, or timeline extension."}, {"k": "C", "t": "Acknowledge the request, describe the scope and timeline implications transparently, and propose options—defer it, descope something else, or extend the timeline—for the stakeholder to choose."}, {"k": "D", "t": "Accept the additional scope into the current release without describing the timeline or descoping implications, allowing the delivery plan to absorb unacknowledged changes until they surface as delays."}], "ans": ["C"]}, {"n": 10, "q": "You are classifying chunking strategies by the corpus type each is best suited to. For each chunking strategy, select the appropriate corpus type: 'Long Structured Documents,' 'Heterogeneous Short Records,' or 'Code or Hierarchical Specifications.'", "kind": "match", "opts": [{"k": "A", "t": "Function-level or section-level chunking for code modules"}, {"k": "B", "t": "Tree-aware chunking that follows code or specification hierarchy"}, {"k": "C", "t": "Per-record chunking where each record is one chunk"}, {"k": "D", "t": "Semantic chunking along clause or paragraph boundaries"}, {"k": "E", "t": "Fixed-size chunking with overlap for short records of similar length"}, {"k": "F", "t": "Hierarchical chunking that mirrors document section structure"}], "choices": ["Code or Hierarchical Specs", "Heterogeneous Short Records", "Long Structured Documents"], "ans": ["Code or Hierarchical Specs", "Code or Hierarchical Specs", "Heterogeneous Short Records", "Long Structured Documents", "Heterogeneous Short Records", "Long Structured Documents"]}, {"n": 11, "q": "You are running a risk assessment on a planned Claude-based deployment and must complete the inventory steps before assessing threats against assets. Which two steps must be completed BEFORE assessing threats against assets to estimate likelihood and impact? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Document the assessment outcome and present it to the risk committee."}, {"k": "B", "t": "Recommend mitigations and residual-risk acceptance for all identified threats."}, {"k": "C", "t": "Identify the assets that the deployment touches, along with the sensitivity of each asset"}, {"k": "D", "t": "Recommend mitigations and residual-risk acceptance for risks that remain."}, {"k": "E", "t": "Enumerate the threat actors and attack vectors relevant to the deployment."}], "ans": ["C", "E"]}, {"n": 12, "q": "You are preparing an operational runbook for a Claude-based service. Which content is essential to include in the runbook?", "kind": "single", "opts": [{"k": "A", "t": "Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on."}, {"k": "B", "t": "Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs."}, {"k": "C", "t": "Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use."}, {"k": "D", "t": "Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response."}], "ans": ["B"]}, {"n": 13, "q": "You are operating an interactive assistant whose dominant performance constraint is per-turn latency. Quality on routine turns is already acceptable. Which configuration adjustment most directly improves latency without disproportionately damaging quality?", "kind": "single", "opts": [{"k": "A", "t": "Disable prompt caching entirely to ensure fresh context processing on every request, preventing stale prefix content from affecting latency-sensitive interactions."}, {"k": "B", "t": "Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system-prompt content."}, {"k": "C", "t": "Increase retrieval depth to the corpus maximum to improve recall regardless of latency."}, {"k": "D", "t": "Switch every turn to the heaviest available model to maximize output quality, accepting that the increased model latency will worsen the per-turn SLO rather than improve it."}], "ans": ["B"]}, {"n": 14, "q": "You are supporting an engineer whose Claude Code session reports a permission denial when the engineer expected the action to be allowed. Which resolution step is most appropriate?", "kind": "single", "opts": [{"k": "A", "t": "Tell the engineer to retry the denied action verbatim repeatedly until the denial stops appearing, without inspecting the active permission rules to determine whether the denial is intentional."}, {"k": "B", "t": "Disable the permission system entirely across all scopes to remove the denial, eliminating all tool-pattern and deny-rule controls rather than identifying and amending the specific rule."}, {"k": "C", "t": "Inspect the active permission rules across all scopes—managed, command-line, local, project, and user—to identify which rule is denying the action and confirm whether it should be amended or remain denied."}, {"k": "D", "t": "Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool-pattern constraints rather than amending only the rule in question."}], "ans": ["C"]}, {"n": 15, "q": "You are selecting a model for a new production workload and must complete the upstream steps before testing candidate models empirically. Which two steps must be completed BEFORE running a representative sample on a candidate model? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Select the lightest model that consistently meets the quality bar across the sample."}, {"k": "B", "t": "Retest the model choice when a new model version becomes available."}, {"k": "C", "t": "Choose a candidate model based on the requirements profile and known capabilities."}, {"k": "D", "t": "Define the quality bar, latency tolerance, and expected volume for the workload."}, {"k": "E", "t": "Sign off the production rollout plan with the platform and security teams."}], "ans": ["C", "D"]}, {"n": 16, "q": "You are building an ethics-review checklist for deployments supported by artificial intelligence. Which two checks belong on the list? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Confirm that vendor licensing terms permit the planned production use of the model."}, {"k": "B", "t": "Verify that outputs do not rely on generalizations about people that the underlying data does not support."}, {"k": "C", "t": "Confirm that high-impact decisions retain human accountability rather than being attributed to the model."}, {"k": "D", "t": "Restrict ethics review to outputs that exceed a defined model-confidence threshold."}, {"k": "E", "t": "Confirm that latency and throughput targets are met across supported user populations."}], "ans": ["B", "C"]}, {"n": 17, "q": "A security team is evaluating two proposed controls. \nControl A adds an outbound tool allowlist with destination restrictions and per-call review. \nControl B scores responses against a stable adversarial evaluation set after each model-version change. \nWhich two risk categories are correctly matched to these controls? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Control A - prompt injection from adversarial content in retrieved data"}, {"k": "B", "t": "Control A - silent quality drift after a model-version upgrade"}, {"k": "C", "t": "Control A - data exfiltration via outbound tool calls"}, {"k": "D", "t": "Control B - data exfiltration via outbound tool calls"}, {"k": "E", "t": "Control B - silent quality drift after a model-version upgrade"}], "ans": ["C", "E"]}, {"n": 18, "q": "You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by its role. Where should role-based access control be enforced in the pipeline?", "kind": "single", "opts": [{"k": "A", "t": "Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents."}, {"k": "B", "t": "At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model."}, {"k": "C", "t": "Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control."}, {"k": "D", "t": "After the response is generated, by post-filtering content that should not have been retrieved."}], "ans": ["B"]}, {"n": 19, "q": "A Claude-based research assistant begins producing responses that confidently contradict its retrieved source documents despite no change to the retrieval pipeline. Which two diagnostic actions most directly identify the root cause of this behavior? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Increase the context-window size to allow more retrieved chunks per query."}, {"k": "B", "t": "Switch the retrieval index to a denser embedding model to improve chunk-relevance scores."}, {"k": "C", "t": "Determine whether the failure reproduces on the previous model version to test for a model mismatch."}, {"k": "D", "t": "Reduce the temperature setting to lower response variance across all query types."}, {"k": "E", "t": "Inspect the system-prompt grounding instructions to determine whether citation constraints remain intact."}], "ans": ["C", "E"]}, {"n": 20, "q": "You are selecting a pattern for a compliance Q&A assistant that must answer policy questions with citations to the authoritative internal source set. Latency, cost, and audit predictability are prioritized. Which pattern is the best fit?", "kind": "single", "opts": [{"k": "A", "t": "Augmented LLM with retrieval-augmented generation over the indexed authoritative corpus and citation rendering on each answer."}, {"k": "B", "t": "Multi-agent orchestration with a planner, researcher, and writer agent for every query."}, {"k": "C", "t": "A pure agent loop with open web-browsing tools to surface the most current policy information, without constraining retrieval to the authoritative internal corpus."}, {"k": "D", "t": "A static prompt with the entire policy corpus concatenated into every request."}], "ans": ["A"]}, {"n": 21, "q": "You are integrating human review into a high-volume classification pipeline where reviewing every output is infeasible. Which sampling strategy best balances throughput with quality oversight?", "kind": "single", "opts": [{"k": "A", "t": "No sampling, relying entirely on user complaints to reveal quality and safety problems after they affect users."}, {"k": "B", "t": "Risk-stratified sampling that reviews all low-confidence and high-impact outputs and a smaller random sample of high-confidence routine outputs."}, {"k": "C", "t": "Inverse sampling that reviews only high-confidence routine outputs and skips low-confidence and high-impact outputs."}, {"k": "D", "t": "Universal review of every output regardless of confidence or throughput impact."}], "ans": ["B"]}, {"n": 22, "q": "You are reviewing an integration specification for security gaps. Which two findings constitute valid security gaps in the specification? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Tool calls execute server-side under a least-privilege service principal with scoped permissions"}, {"k": "B", "t": "Service credentials are placed in the prompt context, where they can leak into logs and traces."}, {"k": "C", "t": "Role-based access control is enforced only at the response-rendering layer after the model accesses restricted data."}, {"k": "D", "t": "Per-user OAuth tokens are exchanged with scope-restricted permissions and refreshed within the active session."}, {"k": "E", "t": "Tool inputs and outputs are encrypted in transit using transport-layer security between services."}], "ans": ["B", "C"]}, {"n": 23, "q": "You are auditing a procurement-assistant agent whose defined responsibility is to draft purchase requests for review. For each tool currently configured on the agent, select yes if the tool should remain after a least-privilege audit. Otherwise, select no if it should be removed.", "kind": "match", "opts": [{"k": "A", "t": "A read-only catalog lookup tool that returns vendor and SKU information"}, {"k": "B", "t": "An inbox-send tool that emails purchase requests to vendors directly"}, {"k": "C", "t": "A draft-write tool that creates purchase-request drafts in the review queue"}, {"k": "D", "t": "A production-database admin tool unrelated to procurement"}, {"k": "E", "t": "A read-only policy-document tool that returns the relevant procurement policies"}], "choices": ["Yes", "No"], "ans": ["Yes", "No", "Yes", "No", "Yes"]}, {"n": 24, "q": "You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select Yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select No.", "kind": "match", "opts": [{"k": "A", "t": "Drafting first-pass investigative reports from semi-structured incident logs for analyst review."}, {"k": "B", "t": "Computing real-time fraud scores at sub-50-millisecond latency on a streaming pipeline."}, {"k": "C", "t": "Long-context contract review with structured clause extraction and deviation flagging."}, {"k": "D", "t": "Replacing a vector index for semantic retrieval over a multi-million-document corpus."}, {"k": "E", "t": "Routing inbound support tickets into 30 categories with reasoning for the chosen routing."}], "choices": ["Yes", "No"], "ans": ["Yes", "No", "Yes", "No", "Yes"]}, {"n": 25, "q": "A research summarization assistant has been deployed for six months. A user has flagged that a generated summary contained a fabricated citation. Which two Diligence-competency actions should you take? (Select two.) \nEach correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Sample recent summaries to estimate the fabrication frequency across the population."}, {"k": "B", "t": "Disable the assistant immediately for all current users without any prior diagnostic analysis."}, {"k": "C", "t": "Review whether citation-grounding controls exist anywhere in the current generation pipeline."}, {"k": "D", "t": "Communicate to users that the assistant does not fabricate output as a matter of design."}, {"k": "E", "t": "Treat the incident as an anecdotal isolated case and take no further investigative action."}], "ans": ["A", "C"]}, {"n": 26, "q": "You are distinguishing functional from non-functional requirements during discovery. Which item is a non-functional requirement?", "kind": "single", "opts": [{"k": "A", "t": "The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record."}, {"k": "B", "t": "The system must produce a draft response that a human reviewer can edit before sending."}, {"k": "C", "t": "The system must classify inbound tickets into a defined set of categories."}, {"k": "D", "t": "The system must respond at p95 latency under 800 milliseconds at the expected request volume."}], "ans": ["D"]}, {"n": 27, "q": "You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the engineering leads who will implement the decision. Which presentation strategy best serves both audiences?", "kind": "single", "opts": [{"k": "A", "t": "Open with a deep dive into low-level implementation details targeted at engineering leads, and stop there without addressing the business outcomes or trade-offs the executive sponsor needs."}, {"k": "B", "t": "Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience."}, {"k": "C", "t": "Skip the rationale, alternatives, and trade-off discussion entirely and simply announce the chosen decision, leaving both audiences without the context needed to implement or validate it."}, {"k": "D", "t": "Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section."}], "ans": ["B"]}, {"n": 28, "q": "You are listing characteristics of robust guardrail design for an enterprise deployment. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Centralized log retention for guardrail violations with quarterly review by the security team."}, {"k": "B", "t": "Per-role tool allow-lists enforced at the orchestration layer before any tool call executes."}, {"k": "C", "t": "User feedback channels that route reported guardrail failures into the product backlog for triage."}, {"k": "D", "t": "Periodic refresh of the system prompt wording to keep refusal language current and clear."}, {"k": "E", "t": "Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance."}], "ans": ["B", "E"]}, {"n": 29, "q": "You are responding to an adversarial input pattern in which users include text claiming admin authority and instructing the model to bypass safety restrictions. Which combination of controls most effectively mitigates this attack pattern?", "kind": "single", "opts": [{"k": "A", "t": "Trusting that the model will intrinsically recognize and reject all bypass attempts without prompt-level instructions, runtime classifiers, scoped permissions, or audit logging."}, {"k": "B", "t": "Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts."}, {"k": "C", "t": "Removing all safety restrictions and guardrails to eliminate the attack surface that bypass attempts target, accepting that this makes the assistant unrestricted for all inputs."}, {"k": "D", "t": "Granting users any privilege level they assert in their message content, on the assumption that cooperative behavior requires honoring self-declared authority without independent verification."}], "ans": ["B"]}, {"n": 30, "q": "An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a scheduled maintenance window, causing downstream processing failures. Which two investigative steps most directly isolate the root cause? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Clear the prompt cache and resubmit all pending requests to eliminate stale cached prefixes."}, {"k": "B", "t": "Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window."}, {"k": "C", "t": "Switch to a different Claude model tier to rule out provider-side changes as a contributing factor."}, {"k": "D", "t": "Increase the max_tokens limit to determine whether output truncation is causing incomplete JSON structures."}, {"k": "E", "t": "Replay a set of pre-maintenance requests against the current configuration and inspect the raw model output before downstream parsing."}], "ans": ["B", "E"]}, {"n": 31, "q": "You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission dialogs appeared during the first launch. Which response is most appropriate?", "kind": "single", "opts": [{"k": "A", "t": "Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed."}, {"k": "B", "t": "Reinstall the operating system to clear all permission state without first confirming whether the one-time permission grant caused the failure."}, {"k": "C", "t": "Disable operating-system permission dialogs entirely, accept the resulting security implications, and proceed without confirming whether the failure recurs."}, {"k": "D", "t": "Treat the first-run failure as a permanent fault, replace the MCP server, and do not verify whether subsequent runs succeed."}], "ans": ["A"]}, {"n": 32, "q": "A platform team operates a self-hosted multi-agent system on Kubernetes that orchestrates seven specialized agents for invoice processing. The team spends approximately 40 percent of engineering capacity on infrastructure maintenance, message bus reliability, and agent state recovery. The CFO has asked you to evaluate moving to managed agent infrastructure to reclaim engineering capacity. The security officer requires that all customer financial data remain within an approved network boundary.\n Which factor should most heavily influence your recommendation?", "kind": "single", "opts": [{"k": "A", "t": "Whether the current seven agents map cleanly to the patterns supported by managed agents."}, {"k": "B", "t": "Whether managed agents reduce per-invoice token costs across the existing processing volume."}, {"k": "C", "t": "Whether managed agents support the current bus topology used by the platform team."}, {"k": "D", "t": "Whether managed agent data handling satisfies the network boundary required by security."}], "ans": ["D"]}, {"n": 33, "q": "You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted Bash access to all projects across all developers. Which response is most appropriate?", "kind": "single", "opts": [{"k": "A", "t": "Add unrestricted access to additional tool categories as well, so that Bash is not asymmetrically more permissive than other tools, expanding the attack surface further in the name of consistency."}, {"k": "B", "t": "Approve the unrestricted Bash access as written on the grounds that narrowing the rules would add configuration complexity, accepting the full attack surface for all engineers across all projects."}, {"k": "C", "t": "Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations."}, {"k": "D", "t": "Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations."}], "ans": ["C"]}, {"n": 34, "q": "You are compiling guardrail tactics for a customer-facing assistant. Which two tactics belong on the guardrail list? Each correct answer presents a complete solution.", "kind": "multi", "opts": [{"k": "A", "t": "Embed approved override phrases that users can invoke to bypass guardrails."}, {"k": "B", "t": "Lower sampling temperature globally to eliminate all variability in responses."}, {"k": "C", "t": "Validate the model output against a structured schema before downstream actions are taken."}, {"k": "D", "t": "Layer prompt-level guardrails with runtime content checks rather than relying on either alone."}, {"k": "E", "t": "Rely on a single hardened system prompt as the only guardrail mechanism."}], "ans": ["C", "D"]}, {"n": 35, "q": "You are designing a content moderation classifier that processes high volumes of usergenerated comments under a tight per-message latency budget using well-defined classification labels. Which model selection best aligns with the workload?", "kind": "single", "opts": [{"k": "A", "t": "Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity."}, {"k": "B", "t": "Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth."}, {"k": "C", "t": "Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict."}, {"k": "D", "t": "Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling."}], "ans": ["B"]}, {"n": 36, "q": "You are sequencing decomposed components in an invoice-processing pipeline. For each of the decomposed components, select the execution layer it belongs to: 'Pre-Processing,' 'Model Stage,' or 'Post-Processing.'", "kind": "match", "opts": [{"k": "A", "t": "Claude-based classification of invoice type"}, {"k": "B", "t": "Persistence of validated records to the system of record"}, {"k": "C", "t": "Schema validation of the extracted fields"}, {"k": "D", "t": "Claude-based extraction of structured invoice fields"}, {"k": "E", "t": "PII redaction on extracted text prior to model invocation"}, {"k": "F", "t": "Optical character recognition on scanned invoice images"}], "choices": ["Model Stage", "Post-Processing", "Pre-Processing"], "ans": ["Model Stage", "Post-Processing", "Post-Processing", "Model Stage", "Pre-Processing", "Pre-Processing"]}, {"n": 37, "q": "You are evaluating retrieval-strategy claims used by a peer team. For each claim, select yes if the statement is generally accurate. Otherwise, select no.", "kind": "match", "opts": [{"k": "A", "t": "Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text."}, {"k": "B", "t": "Sparse term-matching retrieval recovers exact terms (such as identifiers and rare tokens) more reliably than dense alone."}, {"k": "C", "t": "Structured query retrieval is the right fit for filter-and-aggregate workloads against a relational store with schema and indexes."}, {"k": "D", "t": "Hybrid retrieval is identical to dense-only retrieval and shares the same recall characteristics."}, {"k": "E", "t": "Random sampling of a data store is a sound retrieval strategy for production Q&A."}], "choices": ["Yes", "No"], "ans": ["Yes", "Yes", "Yes", "No", "No"]}, {"n": 38, "q": "You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many servers, exhausting context budget before the session begins. Which adjustment most directly addresses this issue without removing capability?", "kind": "single", "opts": [{"k": "A", "t": "Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront."}, {"k": "B", "t": "Disable every MCP server in the configuration to free up context budget, accepting that the team loses all tool access and cannot perform any MCP-dependent task in the session."}, {"k": "C", "t": "Increase the prompt's verbosity with additional instructions and context, which consumes more of the context budget rather than reducing the tool-definition overhead causing the issue."}, {"k": "D", "t": "Add additional MCP servers to give the team more capability, which increases rather than reduces the number of tool definitions loaded into the session's context budget."}], "ans": ["A"]}, {"n": 39, "q": "A team manager wants all engineers working on the same repository to share identical MCP server definitions without manual synchronization. Which configuration approach satisfies this requirement?", "kind": "single", "opts": [{"k": "A", "t": "Managed configuration pushed to all endpoints by the administrator."}, {"k": "B", "t": "Environment variables set at the operating-system level on each workstation."}, {"k": "C", "t": "Project-scope .claude/settings.json and .mcp.json files committed to the repository."}, {"k": "D", "t": "Each engineer maintains a personal ~/.claude/settings.json with the shared definitions."}], "ans": ["C"]}, {"n": 40, "q": "The platform team at Trenova Systems, Inc. needs to reduce per-query cost and p95 latency for a high-volume Claude pipeline without degrading output quality on the core use case. Which two optimizations directly target both cost and latency simultaneously? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Enable prompt caching on the static system-prompt prefix to reduce billable input tokens on repeated calls."}, {"k": "B", "t": "Route straightforward query types to a smaller, faster Claude model and reserve the full model for complex cases."}, {"k": "C", "t": "Increase max_tokens to reduce the frequency of truncated responses requiring follow-up calls."}, {"k": "D", "t": "Add a retrieval step that fetches the full source corpus into the context window before generation."}, {"k": "E", "t": "Expand the system prompt to include additional few-shot examples on every request."}], "ans": ["A", "B"]}, {"n": 41, "q": "You are evaluating model-selection claims used by a peer team. For each statement, select yes if the statement is generally true. Otherwise, select no.", "kind": "match", "opts": [{"k": "A", "t": "Heavier-reasoning models typically consume more of the rate limit and run more slowly than lighter models on the same input."}, {"k": "B", "t": "A representative-sample evaluation on the target workload is the right basis for confirming a model selection."}, {"k": "C", "t": "The most capable model is always the right choice regardless of the workload profile."}, {"k": "D", "t": "Tiered routing can serve routine traffic with a lighter model while reserving a heavier model for traffic that needs its capability."}, {"k": "E", "t": "Selecting a model based on which version was most recently announced is the right basis for production decisions."}], "choices": ["Yes", "No"], "ans": ["Yes", "Yes", "No", "Yes", "No"]}, {"n": 42, "q": "You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. Which two test types should be prioritized to cover both safety under attack and cross-component correctness? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Adversarial tests using prompt-injection and malformed-input cases."}, {"k": "B", "t": "Regression tests against a stable reference set of previously known-good outputs."}, {"k": "C", "t": "Smoke tests that verify core paths after each deployment."}, {"k": "D", "t": "Integration tests that verify end-to-end pipeline behavior across all components."}, {"k": "E", "t": "Unit tests targeting only individual prompt-template rendering logic."}], "ans": ["A", "D"]}, {"n": 43, "q": "A revenue projection assistant has missed its monthly cost target by 38 percent. Profiling shows three contributors: a 6,000-token policy preamble repeated on every call (45 percent of cost), retrieval of historical sales chunks averaging 3,000 tokens per call (30 percent), and inference on a flagship-tier model (25 percent). Stakeholders require that projection accuracy remain unchanged. Which two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.) Each correct answer presents part of the solution.", "kind": "multi", "opts": [{"k": "A", "t": "Reduce the number of historical sales chunks retrieved across each query run."}, {"k": "B", "t": "Truncate the policy preamble to remove non-essential clauses from the prompt."}, {"k": "C", "t": "Enable prompt caching on the static policy preamble across the recurring calls."}, {"k": "D", "t": "Switch the workload to a smaller, faster Claude model tier across all queries."}, {"k": "E", "t": "Cache common retrieved sales chunks accessed across many of the daily queries."}], "ans": ["C", "E"]}, {"n": 44, "q": "You are integrating AI-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in the actual code. Which integration approach best fits this requirement?", "kind": "single", "opts": [{"k": "A", "t": "Generate documentation from the model's training-data recall without reading any of the actual repository code, accepting that the output will not reflect the current implementation."}, {"k": "B", "t": "Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow or any human approval step."}, {"k": "C", "t": "Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow."}, {"k": "D", "t": "Disable all filesystem and code-search tools so the subagents cannot read any repository code, accepting that documentation generation will be entirely disconnected from the actual implementation."}], "ans": ["C"]}, {"n": 45, "q": "A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations. Which two guardrail implementations most directly enforce this constraint? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Increase response temperature to introduce variability that reduces the likelihood of specific recommendations."}, {"k": "B", "t": "Add an output classifier that detects and blocks responses containing regulated investment recommendation language."}, {"k": "C", "t": "Limit session length to reduce the volume of queries processed per user per day."}, {"k": "D", "t": "Log all user queries to a SIEM for post-hoc compliance review."}, {"k": "E", "t": "Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advice requests."}], "ans": ["B", "E"]}, {"n": 46, "q": "You are assessing a Claude-based system whose dominant risk is silent quality drift on safety-relevant outputs after a model-version upgrade. Which assessment activity most directly addresses this risk?", "kind": "single", "opts": [{"k": "A", "t": "Disable adversarial evaluation entirely during model-version upgrade cycles to reduce evaluation cost, accepting that safety drift will go undetected until it appears in production."}, {"k": "B", "t": "Rotate adversarial inputs randomly so no two upgrades are scored on the same set."}, {"k": "C", "t": "Skip evaluation on each model-version upgrade and rely on user-submitted complaints to surface safety drift after the upgraded model has already served production traffic."}, {"k": "D", "t": "Maintain an adversarial evaluation set with version-attributed scoring so each upgrade is measured against the same set before promotion."}], "ans": ["D"]}, {"n": 47, "q": "You are transitioning a Claude-based deployment from design into implementation. Which handoff package most directly supports a clean transition?", "kind": "single", "opts": [{"k": "A", "t": "The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register."}, {"k": "B", "t": "A verbal walkthrough conducted on the day of handoff with no written architecture overview, ADRs, component contracts, evaluation framework, runbooks, playbook, or known limitations."}, {"k": "C", "t": "Architecture overview, ADRs, component contracts, evaluation framework with reference set, runbooks, on-call playbook, and known limitations."}, {"k": "D", "t": "Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation framework, runbooks, on-call playbook, or known-limitations register to support the delivery team."}], "ans": ["C"]}, {"n": 48, "q": "A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during a case. The current architecture sends the full filing on every query. The CFO has asked you to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside the organization's tenancy. Which optimization approach should you recommend?", "kind": "single", "opts": [{"k": "A", "t": "Summarize each filing once at intake and run all subsequent queries against the summary."}, {"k": "B", "t": "Cache the filing as the prompt prefix for reuse across the 14 queries per case."}, {"k": "C", "t": "Index filings in a vector store and retrieve d."}], "ans": ["A", "C"]}, {"n": 51, "q": "A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through development. Stakeholders have escalating concerns about response latency. Which two actions most directly address stakeholder expectation alignment in this situation? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data."}, {"k": "B", "t": "Pause all development until latency concerns are fully resolved."}, {"k": "C", "t": "Communicate that latency concerns are a known LLM limitation that cannot be addressed."}, {"k": "D", "t": "Replace the current Claude model with a third-party model to signal responsiveness."}, {"k": "E", "t": "Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints."}], "ans": ["A", "E"]}, {"n": 52, "q": "A technical team is cataloguing risks specific to Claude's use in a document-grounded Q&A system. Which two items represent failure modes intrinsic to LLM-based systems rather than generic software defects? (Select two.)", "kind": "multi", "opts": [{"k": "A", "t": "An expired TLS certificate blocks outbound API calls to Claude."}, {"k": "B", "t": "A database connection timeout causes retrieval to return an empty result set."}, {"k": "C", "t": "The model refuses a legitimate query because surface features trigger an overly broad safety pattern."}, {"k": "D", "t": "A misconfigured load balancer routes requests to a deprecated API version."}, {"k": "E", "t": "The model generates a plausible-sounding answer unsupported by any retrieved document."}], "ans": ["C", "E"]}, {"n": 53, "q": "You are evaluating prompting claims in a peer's design document. For each claim, select yes if the claim reflects sound practice. Otherwise, select no.", "kind": "match", "opts": [{"k": "A", "t": "Zero-shot is appropriate as a

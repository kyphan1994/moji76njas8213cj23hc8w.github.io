/* ===== Tiện ích ===== */
const KEY='ccarp-progress-v1',KEX='ccarp-exam-v1',KHIS='ccarp-history-v1',KWB='ccarp-wrong-v1',KSET='ccarp-setup-v1',KVIEW='ccarp-view',KTH='ccarp-theme';
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L='ABCDEF';
const Q={};DATA.forEach(q=>{Q[q.n]=q});
const TMAP={},TOPIC_BY_N={};TOPICS.forEach(t=>{TMAP[t.id]=t;t.ns.forEach(n=>{TOPIC_BY_N[n]=t})});
const topicOf=n=>TOPIC_BY_N[n]||TMAP.arch;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const answered=s=>Array.isArray(s)&&s.some(Boolean);
function isRight(q,s){if(!Array.isArray(s))return false;if(q.kind==='match')return q.ans.every((a,i)=>s[i]===a);return s.length===q.ans.length&&q.ans.every(a=>s.includes(a))}
const pad=n=>String(n).padStart(2,'0');
function fmtS(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`}
const fmtDate=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const band=p=>p>=80?'g':p>=60?'m':'b';

let WB=new Set(load(KWB,[]));
function markResult(n,ok){if(ok)WB.delete(n);else WB.add(n);store(KWB,[...WB])}

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000)}
function ask(msg,ok,cancel){
  const d=$('#dlg');
  if(typeof d.showModal!=='function')return Promise.resolve(confirm(msg));
  $('#dlgMsg').textContent=msg;$('#dlgOk').textContent=ok||'Đồng ý';$('#dlgCancel').textContent=cancel||'Huỷ';
  d.returnValue='';d.showModal();
  return new Promise(res=>{d.onclose=()=>res(d.returnValue==='ok')});
}

/* ===== Thẻ câu hỏi dùng chung ===== */
function buildCard(q,o){
  o=o||{};
  const el=document.createElement('section');el.className='q';el.dataset.n=q.n;if(o.id)el.id=o.id;
  const order=o.order||q.opts.map((_,i)=>i),tp=topicOf(q.n);
  const tag=q.kind==='single'?'Chọn 1':q.kind==='multi'?`Chọn ${q.ans.length}`:'Chọn cho từng mục';
  let body;
  if(q.kind==='match'){
    body=order.map((i,d)=>`<div class="opt match" data-i="${i}"><span class="k">${L[d]}</span><span class="t">${esc(q.opts[i].t)}</span><select aria-label="Mục ${L[d]}"><option value="">— chọn —</option>${q.choices.map(c=>`<option>${esc(c)}</option>`).join('')}</select><span class="corr">Đáp án: ${esc(q.ans[i])}</span></div>`).join('');
  }else{
    const type=q.kind==='single'?'radio':'checkbox';
    body=order.map((i,d)=>{const it=q.opts[i];return `<label class="opt" data-k="${it.k}"><input type="${type}" name="${o.prefix||'p'}${q.n}" value="${it.k}"><span class="k">${L[d]}</span><span class="t">${esc(it.t)}</span></label>`}).join('');
  }
  const w=WARN[q.n];
  el.innerHTML=`<div class="qhead"><span class="qnum">${o.label||'Q.'+q.n}</span>${o.sub?`<span class="qsub">${o.sub}</span>`:''}<span class="tag">${tag}</span><span class="topic" style="--tc:var(${tp.c})">${esc(tp.short)}</span>${o.extra||''}</div>`+
    `<p class="qtext">${esc(q.q)}</p><div class="opts">${body}</div>`+
    `<div class="why"><div class="why-h">Vì sao?</div><p>${esc(EXPL[q.n]||'')}</p>${w?`<p class="warn">⚠ ${esc(w)}</p>`:''}</div><div class="qfoot"></div>`;
  return el;
}
function getSel(q,el){
  if(q.kind==='match'){const a=Array(q.opts.length).fill('');$$('.opt.match',el).forEach(r=>{a[+r.dataset.i]=r.querySelector('select').value});return a}
  return $$('input:checked',el).map(i=>i.value);
}
function setSel(q,el,sel){
  if(!Array.isArray(sel))return;
  if(q.kind==='match')$$('.opt.match',el).forEach(r=>{r.querySelector('select').value=sel[+r.dataset.i]||''});
  else $$('input',el).forEach(i=>{i.checked=sel.includes(i.value)});
}
function setVerdict(el,kind){const v=el.querySelector('.verdict');if(!v)return;v.className='verdict'+(kind?' '+kind:'');v.textContent={ok:'✓ Đúng',no:'✗ Sai',blank:'Bỏ trống'}[kind]||''}
function reveal(q,el,sel,graded){
  sel=sel||[];graded=!!graded;
  el.classList.add('reveal');el.classList.toggle('graded',graded);
  if(q.kind==='match'){
    $$('.opt.match',el).forEach(r=>{const i=+r.dataset.i,g=sel[i]===q.ans[i];r.classList.toggle('good',graded&&g);r.classList.toggle('bad',graded&&!g)});
  }else{
    $$('.opt',el).forEach(o=>{const k=o.dataset.k;o.classList.toggle('is-ans',q.ans.includes(k));o.classList.toggle('picked-wrong',graded&&sel.includes(k)&&!q.ans.includes(k))});
  }
  if(graded){const ok=isRight(q,sel);el.classList.toggle('right',ok);el.classList.toggle('wrong',!ok);setVerdict(el,ok?'ok':answered(sel)?'no':'blank')}
  else{el.classList.remove('right','wrong');setVerdict(el,'')}
}
function unreveal(el){el.classList.remove('reveal','graded','right','wrong');$$('.opt',el).forEach(o=>o.classList.remove('picked-wrong','good','bad','is-ans'));setVerdict(el,'')}
function lock(el){el.classList.add('locked');$$('input,select',el).forEach(i=>{i.disabled=true})}
function limitMulti(q,el,t){
  if(q.kind!=='multi'||!t||t.type!=='checkbox'||!t.checked)return;
  if($$('input:checked',el).length>q.ans.length){t.checked=false;toast(`Câu này chỉ chọn ${q.ans.length} đáp án. Bỏ bớt một lựa chọn trước đã.`)}
}

/* ===== Chế độ Luyện tập ===== */
const P={state:load(KEY,{})||{},topic:'all',onlyWrong:false,showAll:false,snap:new Set(),prog:0};
const inTopic=n=>P.topic==='all'||topicOf(n).id===P.topic;
const pEl=n=>document.getElementById('p'+n);

function renderPChips(){
  $('#pChips').innerHTML=`<button class="chip" data-t="all" aria-pressed="${P.topic==='all'}">Tất cả <span class="cnt">${DATA.length}</span></button>`+
    TOPICS.map(t=>`<button class="chip" data-t="${t.id}" style="--tc:var(${t.c})" aria-pressed="${P.topic===t.id}"><span class="dot"></span>${esc(t.short)} <span class="cnt">${t.ns.length}</span></button>`).join('');
}
function renderPractice(){
  const list=$('#pList');list.innerHTML='';
  const frag=document.createDocumentFragment();
  for(const q of DATA){
    const el=buildCard(q,{id:'p'+q.n,prefix:'p'});
    el.querySelector('.qfoot').innerHTML='<button class="btn check">Kiểm tra</button><span class="verdict"></span>';
    const st=P.state[q.n];
    if(st){setSel(q,el,st.sel);if(st.checked)reveal(q,el,st.sel,true)}
    if(P.showAll&&!(st&&st.checked))reveal(q,el,[],false);
    el.addEventListener('change',e=>pChange(q,el,e));
    el.querySelector('.check').addEventListener('click',()=>pCheck(q,el));
    frag.appendChild(el);
  }
  list.appendChild(frag);
  $('#pJump').innerHTML='<option value="">Tới câu…</option>'+DATA.map(q=>`<option value="${q.n}">Q.${q.n} · ${esc(topicOf(q.n).short)}</option>`).join('');
  syncP();applyPFilter();updatePStats();renderInlineNotes();
}
function syncP(){
  $$('#pChips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t===P.topic));
  $('#pWrong').setAttribute('aria-pressed',P.onlyWrong);
  $('#pShow').setAttribute('aria-pressed',P.showAll);
}
function pChange(q,el,e){
  limitMulti(q,el,e.target);
  P.state[q.n]={sel:getSel(q,el),checked:false};
  unreveal(el);if(P.showAll)reveal(q,el,[],false);
  store(KEY,P.state);updatePStats(); // không lọc lại → câu đang sửa không biến mất
}
function pCheck(q,el){
  const sel=getSel(q,el);
  if(!answered(sel)){toast('Bạn chưa chọn đáp án cho câu này.');return}
  reveal(q,el,sel,true);P.state[q.n]={sel,checked:true};markResult(q.n,isRight(q,sel));
  store(KEY,P.state);updatePStats();
}
function applyPFilter(){
  let vis=0;
  for(const q of DATA){const show=inTopic(q.n)&&(!P.onlyWrong||P.snap.has(q.n));pEl(q.n).classList.toggle('hide',!show);if(show)vis++}
  $('#pEmpty').hidden=vis>0;
}
function updatePStats(){
  let t=0,d=0,c=0,r=0;const pend=[];
  for(const q of DATA){if(!inTopic(q.n))continue;t++;const s=P.state[q.n];if(!s)continue;if(answered(s.sel)){d++;if(!s.checked)pend.push(q.n)}if(s.checked){c++;if(isRight(q,s.sel))r++}}
  $('#pStats').innerHTML=(P.topic==='all'?'':`<span class="sname">${esc(TMAP[P.topic].short)}</span> · `)+`Đã làm <b>${d}</b>/${t} · Đã chấm <b>${c}</b> · Đúng <b>${r}</b>${c?`/${c} (${Math.round(r/c*100)}%)`:''}`+
    (pend.length?` · <button class="linkbtn pend" data-n="${pend[0]}" title="Câu đã chọn đáp án nhưng chưa bấm Kiểm tra (hoặc đã sửa sau khi chấm)">${pend.length} câu chưa chấm →</button>`:'');
  P.prog=t?d/t:0;updateHeaderBar();
}
function renderInlineNotes(){
  const box=$('#pNotes');
  if(P.topic==='all'){box.hidden=true;return}
  const t=TMAP[P.topic];box.hidden=false;box.style.setProperty('--tc',`var(${t.c})`);
  box.querySelector('summary').textContent=`Ghi nhớ nhanh: ${t.name}`;
  box.querySelector('ul').innerHTML=t.notes.map(x=>`<li>${x}</li>`).join('');
}
function setPTopic(id){
  P.topic=id;syncP();applyPFilter();updatePStats();renderInlineNotes();
}
$('#pChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;setPTopic(c.dataset.t);window.scrollTo({top:0})});
$('#pWrong').onclick=()=>{
  P.onlyWrong=!P.onlyWrong;
  if(P.onlyWrong){
    // chụp danh sách câu sai tại thời điểm bật lọc
    P.snap=new Set(DATA.filter(q=>{const s=P.state[q.n];return s&&s.checked&&!isRight(q,s.sel)}).map(q=>q.n));
    if(!P.snap.size)toast('Chưa có câu sai nào trong các câu đã chấm.');
  }
  syncP();applyPFilter();
};
$('#pShow').onclick=()=>{
  P.showAll=!P.showAll;
  for(const q of DATA){const s=P.state[q.n];if(s&&s.checked)continue;const el=pEl(q.n);if(P.showAll)reveal(q,el,[],false);else unreveal(el)}
  syncP();
};
$('#pGrade').onclick=()=>{
  let g=0,skip=0;
  for(const q of DATA){
    if(!inTopic(q.n))continue;
    const el=pEl(q.n),sel=getSel(q,el);
    if(!answered(sel)){skip++;continue}
    const ok=isRight(q,sel);reveal(q,el,sel,true);P.state[q.n]={sel,checked:true};markResult(q.n,ok);g++;
    if(P.onlyWrong&&!ok)P.snap.add(q.n);
  }
  store(KEY,P.state);applyPFilter();updatePStats();
  toast(g?`Đã chấm ${g} câu${skip?` · ${skip} câu chưa trả lời được bỏ qua`:''}.`:'Chưa có câu nào được trả lời để chấm.');
};
$('#pReset').onclick=async()=>{
  if(!await ask('Xoá toàn bộ câu trả lời ở chế độ Luyện tập? Lịch sử luyện đề vẫn được giữ.','Xoá'))return;
  P.state={};P.onlyWrong=false;P.showAll=false;P.snap.clear();P.topic='all';
  store(KEY,P.state);renderPChips();renderPractice();window.scrollTo({top:0});toast('Đã xoá câu trả lời, bắt đầu lại từ đầu.');
};
$('#pJump').onchange=e=>{const n=+e.target.value;e.target.value='';if(n)jumpTo(n)};
$('#pStats').addEventListener('click',e=>{const b=e.target.closest('.pend');if(b)jumpTo(+b.dataset.n)});
function jumpTo(n){
  const el=pEl(n);
  if(el.classList.contains('hide')){P.topic='all';P.onlyWrong=false;syncP();applyPFilter();updatePStats();renderInlineNotes();toast(`Đã tắt bộ lọc để hiện Q.${n}.`)}
  const tb=$('.ptools'),sticky=getComputedStyle(tb).position==='sticky';
  const off=$('#top').offsetHeight+(sticky?tb.offsetHeight:0)+12;
  window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-off,behavior:'smooth'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}

/* ===== Chế độ Luyện đề ===== */
let X=load(KEX,null),examView='setup',timerId=null,HIS=load(KHIS,[])||[];
if(X&&(!Array.isArray(X.qs)||!X.qs.every(n=>Q[n])))X=null;
const S=Object.assign({topics:TOPICS.map(t=>t.id),count:20,pace:1.5,custom:30,shufQ:true,shufO:true,mode:'test',wrongOnly:false},load(KSET,{})||{});
S.topics=S.topics.filter(id=>TMAP[id]);
const saveS=()=>store(KSET,S);
const running=()=>!!(X&&!X.done);
const poolList=()=>DATA.filter(q=>S.topics.includes(topicOf(q.n).id)&&(!S.wrongOnly||WB.has(q.n))).map(q=>q.n);
const minutesFor=n=>S.pace==='custom'?Math.max(1,Math.round(+S.custom)||1):Math.max(1,Math.ceil(n*S.pace));

function renderExam(){
  const w=$('#xWrap');w.classList.remove('wide');
  if(running()){examView='run';renderRun()}
  else if(examView==='result'&&X&&X.done)renderResult();
  else{examView='setup';renderSetup()}
  updateHeaderBar();
}

function renderSetup(){
  const w=$('#xWrap');
  w.innerHTML=`<div class="panel">
    <h2>Luyện đề theo chủ đề</h2>
    <p class="lead">Chọn chủ đề, số câu và thời gian. Câu hỏi được lấy ngẫu nhiên từ các chủ đề đã chọn.</p>
    <div class="field"><div class="flabel">Chủ đề <span class="hint"><button class="linkbtn" id="sAll">Chọn tất cả</button> · <button class="linkbtn" id="sNone">Bỏ chọn</button></span></div><div class="chips" id="sTopics"></div></div>
    <div class="field"><div class="flabel">Nguồn câu hỏi</div><label class="checkline"><input type="checkbox" id="sWrong"><span>Chỉ lấy các câu đang làm sai <span class="muted" id="sWbCnt"></span></span></label></div>
    <div class="field"><div class="flabel">Số câu: <b id="sCountV"></b><span class="hint" id="sPoolV"></span></div><input type="range" id="sCount" min="1" aria-label="Số câu"><div class="seg" id="sQuick"></div></div>
    <div class="field"><div class="flabel">Thời gian <span class="hint" id="sTimeV"></span></div><div class="seg" id="sPace"></div><div class="customrow" id="sCustomRow"><input type="number" class="num-in" id="sCustom" min="1" max="600" aria-label="Số phút"> phút</div></div>
    <div class="field"><div class="flabel">Trộn</div><label class="checkline"><input type="checkbox" id="sShufQ">Trộn thứ tự câu hỏi</label><label class="checkline"><input type="checkbox" id="sShufO">Trộn thứ tự phương án (chữ A, B, C… được đánh lại)</label></div>
    <div class="field"><div class="flabel">Cách chấm</div><div class="modes">
      <label class="mode"><input type="radio" name="sMode" value="learn"><b>Học</b><span>Bấm Kiểm tra từng câu, xem đáp án và giải thích ngay.</span></label>
      <label class="mode"><input type="radio" name="sMode" value="test"><b>Thi thử</b><span>Không hiện đáp án cho tới khi nộp bài, giống thi thật.</span></label></div></div>
    <div class="startrow"><div class="summary" id="sSum"></div><button class="btn primary big" id="sStart">Bắt đầu</button></div>
  </div>
  ${X&&X.done?'<div class="panel slim"><button class="linkbtn" id="sLast">Xem lại kết quả lượt gần nhất →</button></div>':''}
  <div class="panel"><div class="phead"><h3>Lịch sử luyện đề</h3>${HIS.length?'<button class="linkbtn" id="sClear">Xoá lịch sử</button>':''}</div>${histHTML()}</div>`;
  $('#sQuick').innerHTML=[10,20,30].map(v=>`<button class="chip" data-c="${v}">${v} câu</button>`).join('')+'<button class="chip" data-c="all">Tất cả</button>';
  $('#sPace').innerHTML=[[1,'1 phút / câu'],[1.5,'1,5 phút / câu'],[2,'2 phút / câu'],['custom','Tự nhập']].map(([v,l])=>`<button class="chip" data-p="${v}">${l}</button>`).join('');
  $('#sTopics').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const id=c.dataset.t;S.topics=S.topics.includes(id)?S.topics.filter(x=>x!==id):[...S.topics,id];saveS();updateSetup()};
  $('#sAll').onclick=()=>{S.topics=TOPICS.map(t=>t.id);saveS();updateSetup()};
  $('#sNone').onclick=()=>{S.topics=[];saveS();updateSetup()};
  $('#sWrong').onchange=e=>{S.wrongOnly=e.target.checked;saveS();updateSetup()};
  $('#sCount').oninput=e=>{S.count=+e.target.value;saveS();updateSetup()};
  $('#sQuick').onclick=e=>{const c=e.target.closest('.chip');if(!c||c.disabled)return;S.count=c.dataset.c==='all'?9999:+c.dataset.c;saveS();updateSetup()};
  $('#sPace').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;S.pace=c.dataset.p==='custom'?'custom':+c.dataset.p;saveS();updateSetup();if(S.pace==='custom')$('#sCustom').focus()};
  $('#sCustom').oninput=e=>{S.custom=+e.target.value;saveS();updateSetup(true)};
  $('#sShufQ').onchange=e=>{S.shufQ=e.target.checked;saveS()};
  $('#sShufO').onchange=e=>{S.shufO=e.target.checked;saveS()};
  $$('input[name="sMode"]').forEach(r=>{r.onchange=()=>{S.mode=r.value;saveS();updateSetup()}});
  $('#sStart').onclick=()=>startExam();
  const last=$('#sLast');if(last)last.onclick=()=>{examView='result';renderExam()};
  const clr=$('#sClear');if(clr)clr.onclick=async()=>{if(await ask('Xoá toàn bộ lịch sử luyện đề?','Xoá')){HIS=[];store(KHIS,HIS);renderSetup()}};
  updateSetup();
}
function updateSetup(keepCustom){
  const pool=poolList().length,cnt=Math.min(S.count,pool);
  $('#sTopics').innerHTML=TOPICS.map(t=>`<button class="chip" data-t="${t.id}" style="--tc:var(${t.c})" aria-pressed="${S.topics.includes(t.id)}"><span class="dot"></span>${esc(t.short)} <span class="cnt">${t.ns.length}</span></button>`).join('');
  const sw=$('#sWrong');sw.checked=S.wrongOnly;sw.disabled=!WB.size&&!S.wrongOnly;$('#sWbCnt').textContent=`(${WB.size} câu)`;
  const r=$('#sCount');r.max=Math.max(1,pool);r.value=Math.max(1,cnt);r.disabled=!pool;
  $('#sCountV').textContent=cnt;$('#sPoolV').textContent=`trong ${pool} câu phù hợp`;
  $$('#sQuick .chip').forEach(c=>{const v=c.dataset.c;c.setAttribute('aria-pressed',v==='all'?S.count>=pool&&pool>0:+v===cnt&&S.count<pool);c.disabled=v!=='all'&&+v>pool});
  $$('#sPace .chip').forEach(c=>c.setAttribute('aria-pressed',String(S.pace)===c.dataset.p));
  $('#sCustomRow').hidden=S.pace!=='custom';if(!keepCustom)$('#sCustom').value=S.custom;
  const min=minutesFor(cnt);
  $('#sTimeV').textContent=cnt?`= ${min} phút cho ${cnt} câu`:'';
  $('#sShufQ').checked=S.shufQ;$('#sShufO').checked=S.shufO;
  $$('input[name="sMode"]').forEach(x=>{x.checked=x.value===S.mode});
  $('#sSum').innerHTML=pool?`<b>${cnt}</b> câu · <b>${min}</b> phút · <b>${S.topics.length}</b> chủ đề · ${S.mode==='learn'?'Chế độ học':'Chế độ thi thử'}`:(S.topics.length?'Không có câu nào phù hợp. Hãy bỏ lọc “câu đang làm sai” hoặc chọn thêm chủ đề.':'Hãy chọn ít nhất một chủ đề.');
  $('#sStart').disabled=!pool;
}
function histHTML(){
  if(!HIS.length)return '<p class="muted" style="margin:0">Chưa có lượt nào. Kết quả mỗi lượt sẽ được lưu ở đây để bạn theo dõi tiến bộ.</p>';
  return '<ul class="hist">'+HIS.slice(0,12).map(h=>`<li><span class="score ${band(h.pct)}">${h.pct}%</span><div class="hmeta"><b>${h.right}/${h.n} câu đúng</b> · ${fmtS(h.used)} / ${h.limit} phút · ${h.mode==='learn'?'Học':'Thi thử'}${h.auto?' · hết giờ':''}<br>${h.topics.length>=TOPICS.length?'Tất cả chủ đề':h.topics.map(id=>TMAP[id]?esc(TMAP[id].short):'').join(', ')}</div><span class="hdate">${fmtDate(h.at)}</span></li>`).join('')+'</ul>';
}
function startExam(list){
  const src=list||poolList();if(!src.length)return;
  const cnt=list?list.length:Math.min(S.count,src.length);
  const qs=shuffle(src).slice(0,cnt);if(!S.shufQ)qs.sort((a,b)=>a-b);
  const ord={};qs.forEach(n=>{const idx=Q[n].opts.map((_,i)=>i);ord[n]=S.shufO?shuffle(idx):idx});
  const min=minutesFor(qs.length),now=Date.now();
  X={id:now,qs,ord,ans:{},chk:{},flag:{},cur:0,mode:S.mode,topics:[...new Set(qs.map(n=>topicOf(n).id))],start:now,end:now+min*60000,limit:min,done:false};
  store(KEX,X);examView='run';renderExam();startTimer();window.scrollTo({top:0});
}
function renderRun(){
  const w=$('#xWrap');w.classList.add('wide');
  const learn=X.mode==='learn';
  w.innerHTML=`<div class="run"><div class="run-main"><div id="xCard"></div>
    <div class="runnav"><button class="btn" id="xPrev">← Câu trước</button><button class="btn" id="xFlag" aria-pressed="false">Đánh dấu</button><span class="grow"></span>${learn?'<button class="btn primary" id="xCheck">Kiểm tra</button>':''}<button class="btn" id="xNext">Câu tiếp →</button></div>
    <p class="kbd">Phím tắt: <kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn · <kbd>←</kbd> <kbd>→</kbd> chuyển câu${learn?' · <kbd>Enter</kbd> kiểm tra / câu tiếp':''} · <kbd>M</kbd> đánh dấu</p></div>
    <aside class="gridnav"><div class="gn-h">Danh sách câu</div><div class="gn" id="xGrid"></div>
    <div class="legend"><span><i></i>Chưa làm</span><span><i class="a"></i>Đã trả lời</span><span><i class="f"></i>Đánh dấu</span>${learn?'<span><i class="o"></i>Đúng</span><span><i class="x"></i>Sai</span>':''}</div></aside></div>`;
  $('#xPrev').onclick=()=>go(-1);
  $('#xNext').onclick=()=>{if(X.cur===X.qs.length-1)submitFlow();else go(1)};
  $('#xFlag').onclick=toggleFlag;
  if(learn)$('#xCheck').onclick=checkCur;
  $('#xGrid').onclick=e=>{const b=e.target.closest('button');if(!b)return;X.cur=+b.dataset.i;store(KEX,X);drawQ()};
  drawQ();
}
function drawQ(){
  const n=X.qs[X.cur],q=Q[n],learn=X.mode==='learn';
  const el=buildCard(q,{prefix:`x${X.id}_`,order:X.ord[n],label:`Câu ${X.cur+1}`,sub:`/ ${X.qs.length} · Q.${n}`});
  el.querySelector('.qfoot').innerHTML='<span class="verdict"></span>';
  setSel(q,el,X.ans[n]);
  if(learn&&X.chk[n]){reveal(q,el,X.ans[n],true);lock(el)}
  el.addEventListener('change',e=>{limitMulti(q,el,e.target);X.ans[n]=getSel(q,el);store(KEX,X);drawGrid();drawInfo()});
  $('#xCard').replaceChildren(el);
  $('#xPrev').disabled=X.cur===0;
  $('#xNext').textContent=X.cur===X.qs.length-1?'Nộp bài':'Câu tiếp →';
  const f=$('#xFlag');f.setAttribute('aria-pressed',!!X.flag[n]);f.textContent=X.flag[n]?'Đã đánh dấu':'Đánh dấu';
  const c=$('#xCheck');if(c)c.disabled=!!X.chk[n];
  drawGrid();drawInfo();
}
function drawGrid(){
  const g=$('#xGrid');if(!g)return;
  g.innerHTML=X.qs.map((n,i)=>{
    const a=X.ans[n];let c=answered(a)?'ans':'';
    if(X.mode==='learn'&&X.chk[n])c=isRight(Q[n],a)?'ok':'bad';
    return `<button data-i="${i}" class="${c}${i===X.cur?' cur':''}${X.flag[n]?' flag':''}" aria-label="Câu ${i+1}">${i+1}</button>`;
  }).join('');
}
function drawInfo(){
  const done=X.qs.filter(n=>answered(X.ans[n])).length;
  $('#xInfo').innerHTML=`Câu <b>${X.cur+1}</b>/${X.qs.length} · Đã trả lời <b>${done}</b>/${X.qs.length}<span class="mbadge">${X.mode==='learn'?'Học':'Thi thử'}</span>`;
}
function go(d){const i=Math.min(X.qs.length-1,Math.max(0,X.cur+d));if(i===X.cur)return;X.cur=i;store(KEX,X);drawQ();window.scrollTo({top:0,behavior:'smooth'})}
function toggleFlag(){const n=X.qs[X.cur];if(X.flag[n])delete X.flag[n];else X.flag[n]=true;store(KEX,X);drawQ()}
function checkCur(){
  const n=X.qs[X.cur],q=Q[n];
  if(X.chk[n]){go(1);return}
  const sel=X.ans[n];
  if(!answered(sel)){toast('Chọn đáp án trước khi kiểm tra.');return}
  X.chk[n]=true;markResult(n,isRight(q,sel));store(KEX,X);drawQ();
}
function pickDisplay(d){
  const opts=$$('#xCard .opt:not(.match)');if(d>=opts.length)return;
  const inp=opts[d].querySelector('input');if(!inp||inp.disabled)return;
  inp.checked=inp.type==='radio'?true:!inp.checked;
  inp.dispatchEvent(new Event('change',{bubbles:true}));
}
async function submitFlow(){
  if(!running())return;
  const blank=X.qs.filter(n=>!answered(X.ans[n])).length,fl=X.qs.filter(n=>X.flag[n]).length;
  let msg=blank?`Còn ${blank} câu chưa trả lời. `:'';if(fl)msg+=`${fl} câu đang được đánh dấu xem lại. `;msg+='Nộp bài và xem kết quả?';
  if(await ask(msg,'Nộp bài','Làm tiếp'))finishExam(false);
}
async function quitFlow(){
  if(!running())return;
  if(!await ask('Huỷ lượt luyện đề này? Kết quả sẽ không được lưu.','Huỷ lượt','Làm tiếp'))return;
  X=null;store(KEX,null);stopTimer();examView='setup';renderExam();window.scrollTo({top:0});
}
function scoreOf(x){
  const r={right:0,wrong:0,blank:0,by:{}};
  for(const n of x.qs){const q=Q[n],a=x.ans[n],t=topicOf(n).id;r.by[t]=r.by[t]||{n:0,r:0};r.by[t].n++;
    if(!answered(a))r.blank++;else if(isRight(q,a)){r.right++;r.by[t].r++}else r.wrong++}
  r.pct=Math.round(r.right/x.qs.length*100);return r;
}
function finishExam(auto){
  if(!running())return;
  X.done=true;X.finishedAt=Math.min(Date.now(),X.end);X.auto=!!auto;
  const r=scoreOf(X);
  X.qs.forEach(n=>markResult(n,isRight(Q[n],X.ans[n])));
  HIS.unshift({at:X.start,n:X.qs.length,right:r.right,pct:r.pct,topics:X.topics,mode:X.mode,used:Math.round((X.finishedAt-X.start)/1000),limit:X.limit,auto:X.auto});
  HIS=HIS.slice(0,30);store(KHIS,HIS);store(KEX,X);stopTimer();
  examView='result';
  if(view==='exam'){renderExam();window.scrollTo({top:0})}else updateHeaderBar();
  if(auto)toast('Hết giờ. Bài đã được nộp tự động.');
}
let rFilter='bad';
function renderResult(){
  const w=$('#xWrap'),r=scoreOf(X),used=Math.round((X.finishedAt-X.start)/1000),miss=r.wrong+r.blank,fl=X.qs.filter(n=>X.flag[n]).length;
  const rows=TOPICS.filter(t=>r.by[t.id]).map(t=>{const b=r.by[t.id],p=Math.round(b.r/b.n*100);return `<div class="tbrow" style="--tc:var(${t.c})"><span class="nm"><span class="dot"></span>${esc(t.short)}</span><span class="track"><i class="${band(p)}" style="width:${Math.max(p,2)}%"></i></span><span class="v">${b.r}/${b.n} · ${p}%</span></div>`}).join('');
  const weak=TOPICS.filter(t=>r.by[t.id]&&r.by[t.id].n>=2).map(t=>({t,p:r.by[t.id].r/r.by[t.id].n})).sort((a,b)=>a.p-b.p)[0];
  const adv=weak&&weak.p<0.8?`<div class="advice"><span class="txt">Nên ôn thêm: <b>${esc(weak.t.name)}</b> (đúng ${r.by[weak.t.id].r}/${r.by[weak.t.id].n}).</span><button class="btn" data-note="${weak.t.id}">Xem ghi nhớ</button><button class="btn" data-drill="${weak.t.id}">Luyện riêng chủ đề này</button></div>`:'';
  if(!miss&&rFilter==='bad')rFilter='all';
  w.innerHTML=`<div class="panel">
    <div class="res-top"><div class="bigpct ${band(r.pct)}">${r.pct}%</div><div><div class="res-title">${r.pct>=80?'Rất tốt!':r.pct>=60?'Khá ổn, còn vài chỗ cần ôn.':'Cần ôn thêm.'}</div><div class="muted">Đúng ${r.right}/${X.qs.length} câu${X.auto?' · Hết giờ, bài được nộp tự động':''}</div></div></div>
    <div class="kpis"><div class="kpi"><div class="v ok">${r.right}</div><div class="l">Đúng</div></div><div class="kpi"><div class="v bad">${r.wrong}</div><div class="l">Sai</div></div><div class="kpi"><div class="v">${r.blank}</div><div class="l">Bỏ trống</div></div><div class="kpi"><div class="v">${fmtS(used)}</div><div class="l">trên ${X.limit} phút</div></div></div>
    <h3>Kết quả theo chủ đề</h3><div class="tbars">${rows}</div>${adv}
    <div class="acts">${miss?`<button class="btn primary" id="rRetry">Làm lại ${miss} câu sai & bỏ trống</button>`:''}<button class="btn" id="rNew">Lượt mới</button></div>
  </div>
  <div class="panel"><div class="phead"><h3>Xem lại bài làm</h3><div class="seg" id="rSeg">
    <button class="chip" data-f="bad"${miss?'':' disabled'}>Sai & bỏ trống (${miss})</button><button class="chip" data-f="all">Tất cả (${X.qs.length})</button><button class="chip" data-f="flag"${fl?'':' disabled'}>Đã đánh dấu (${fl})</button></div></div>
    <div id="rList"></div></div>`;
  const retry=$('#rRetry');if(retry)retry.onclick=()=>startExam(X.qs.filter(n=>!isRight(Q[n],X.ans[n])));
  $('#rNew').onclick=()=>{examView='setup';renderExam();window.scrollTo({top:0})};
  w.querySelectorAll('[data-note]').forEach(b=>{b.onclick=()=>openNote(b.dataset.note)});
  w.querySelectorAll('[data-drill]').forEach(b=>{b.onclick=()=>drillTopic(b.dataset.drill)});
  $('#rSeg').onclick=e=>{const c=e.target.closest('.chip');if(!c||c.disabled)return;rFilter=c.dataset.f;drawReview()};
  drawReview();
}
function drawReview(){
  $$('#rSeg .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===rFilter));
  const box=$('#rList');box.innerHTML='';
  X.qs.forEach((n,i)=>{
    const q=Q[n],a=X.ans[n],ok=isRight(q,a);
    if(rFilter==='bad'&&ok)return;if(rFilter==='flag'&&!X.flag[n])return;
    const el=buildCard(q,{prefix:`r${X.id}_`,order:X.ord[n],label:`Câu ${i+1}`,sub:`Q.${n}`,extra:X.flag[n]?'<span class="fbadge">Đã đánh dấu</span>':''});
    el.querySelector('.qfoot').innerHTML='<span class="verdict"></span>';
    setSel(q,el,a);reveal(q,el,a,true);lock(el);box.appendChild(el);
  });
  if(!box.children.length)box.innerHTML='<p class="empty">Không có câu nào trong mục này.</p>';
}
function drillTopic(id){
  S.topics=[id];S.wrongOnly=false;saveS();
  if(running()){toast('Bạn đang có một lượt luyện đề chưa nộp.');setView('exam');return}
  examView='setup';setView('exam');
}

/* đồng hồ */
function startTimer(){stopTimer();timerId=setInterval(tick,250);tick()}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function tick(){
  if(!running()){stopTimer();updateHeaderBar();return}
  const left=X.end-Date.now();
  if(left<=0){finishExam(true);return}
  const txt=fmtS(Math.ceil(left/1000)),low=left<=Math.max(60000,X.limit*6000);
  const t=$('#xTimer');t.textContent=txt;t.classList.toggle('low',low);
  $('#tabTimer').textContent=txt;
  if(!$('#runbar').hidden)$('#hbar').style.width=(left/(X.limit*60000)*100)+'%';
}

/* ===== Ghi nhớ ===== */
function renderNotes(){
  $('#nWrap').innerHTML=`<div class="panel tips"><h2>Mẹo làm bài</h2><ul>${TIPS.map(t=>`<li>${t}</li>`).join('')}</ul></div>
  <div class="ngrid">${TOPICS.map(t=>`<article class="ncard" id="note-${t.id}" style="--tc:var(${t.c})"><h3>${esc(t.name)}</h3><div class="c">${t.ns.length} câu</div><ul>${t.notes.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="acts"><button class="btn" data-see="${t.id}">Xem câu hỏi</button><button class="btn primary" data-drill="${t.id}">Luyện đề chủ đề này</button></div></article>`).join('')}</div>`;
}
$('#nWrap').addEventListener('click',e=>{
  const s=e.target.closest('[data-see]'),d=e.target.closest('[data-drill]');
  if(s){setView('practice');setPTopic(s.dataset.see);window.scrollTo({top:0})}
  if(d)drillTopic(d.dataset.drill);
});
function openNote(id){setView('notes');const el=document.getElementById('note-'+id);if(el){el.scrollIntoView({behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}

/* ===== Điều hướng, header, phím tắt ===== */
let view='practice';
function setView(v){
  if(!['practice','exam','notes'].includes(v))v='practice';
  view=v;store(KVIEW,v);
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));
  $('#vPractice').hidden=v!=='practice';$('#vExam').hidden=v!=='exam';$('#vNotes').hidden=v!=='notes';
  if(v==='exam')renderExam();
  if(v==='notes')renderNotes();
  updateHeaderBar();window.scrollTo({top:0});
}
function updateHeaderBar(){
  const run=running(),rb=$('#runbar'),bar=$('#hbar');
  rb.hidden=!(run&&view==='exam');$('#tabTimer').hidden=!run;
  bar.classList.toggle('time',!rb.hidden);
  if(!rb.hidden)bar.style.width=(Math.max(0,X.end-Date.now())/(X.limit*60000)*100)+'%';
  else bar.style.width=(view==='practice'?P.prog*100:0)+'%';
}
$$('.tab').forEach(t=>{t.onclick=()=>setView(t.dataset.v)});
$('#xSubmit').onclick=submitFlow;
$('#xQuit').onclick=quitFlow;
$('#themeBtn').onclick=()=>{const th=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=th;try{localStorage.setItem(KTH,th)}catch(e){}};
document.addEventListener('keydown',e=>{
  if(view!=='exam'||examView!=='run'||!running()||$('#dlg').open)return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target,tag=tg.tagName;
  if(tag==='SELECT'||tag==='TEXTAREA'||(tag==='INPUT'&&tg.type==='number'))return;
  const k=e.key;
  if(k==='ArrowRight'){e.preventDefault();go(1)}
  else if(k==='ArrowLeft'){e.preventDefault();go(-1)}
  else if(k==='Enter'){if(tag==='BUTTON')return;if(X.mode==='learn'){e.preventDefault();checkCur()}}
  else if(k==='m'||k==='M')toggleFlag();
  else{const a='abcdef'.indexOf(k.toLowerCase()),b='123456'.indexOf(k),d=a>=0?a:b;if(d>=0&&k.length===1)pickDisplay(d)}
});
const setHH=()=>document.documentElement.style.setProperty('--hh',$('#top').offsetHeight+'px');
if(window.ResizeObserver)new ResizeObserver(setHH).observe($('#top'));else setHH();

/* ===== Khởi động ===== */
renderPChips();renderPractice();
let autoDone=false;
if(running()){if(Date.now()>=X.end){finishExam(true);autoDone=true}else startTimer()}
setView(running()||autoDone?'exam':load(KVIEW,'practice'));
</script>
</body>
</html>
